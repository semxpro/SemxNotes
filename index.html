          const swatch = color === 'default' ? 'conic-gradient(white 50%, #ccc 50%)' : color;
          colorHtml += `<span class="color-chip"><span class="color-swatch" style="background:${swatch};"></span> ${count}</span>`;
        });
        colorHtml += '</div>';
        const extra = document.createElement('div');
        extra.className = 'stat-card';
        extra.innerHTML = `<div class="stat-icon"><i class="fas fa-chart-bar"></i></div><div class="stat-label">Color Distribution</div>${colorHtml}`;
        statsGrid.appendChild(extra);
      }
      dashboardView.classList.add('active');
      notesGrid.style.display = 'none';
      trashView.classList.remove('active');
      searchInput.style.display = 'none';
    }

    // ================================================================
    //  RENDER: TRASH
    // ================================================================
    function renderTrash() {
      if (!currentUser) { trashView.classList.remove('active'); return; }
      const trashNotes = allNotes.filter(n => n.deletedAt).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
      trashCount.textContent = trashNotes.length;
      trashCountLabel.textContent = trashNotes.length + ' items';
      if (trashNotes.length === 0) {
        trashList.innerHTML =
          `<div class="trash-empty"><div><i class="fas fa-trash"></i></div><div class="empty-text">Trash is empty</div><div class="empty-sub">Notes you delete will appear here</div></div>`;
      } else {
        let html = '';
        trashNotes.forEach(n => {
          const title = n.title || 'Untitled';
          const content = n.content || '';
          const excerpt = content.substring(0, 60) + (content.length > 60 ? '…' : '');
          const daysAgo = Math.floor((Date.now() - n.deletedAt) / (24 * 60 * 60 * 1000));
          const daysLeft = TRASH_DAYS - daysAgo;
          html += `
            <div class="trash-note" data-id="${n.id}">
              <div class="trash-info"><div class="trash-title">${escHtml(title)}</div><div class="trash-excerpt">${escHtml(excerpt)}</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Deleted ${formatDate(n.deletedAt)} · ${daysLeft > 0 ? daysLeft + ' days left' : 'Expiring soon'}</div></div>
              <div class="trash-actions"><button class="trash-btn restore-btn" data-id="${n.id}"><i class="fas fa-undo"></i> Restore</button><button class="trash-btn delete-forever-btn" data-id="${n.id}"><i class="fas fa-trash-alt"></i> Delete</button></div>
            </div>
          `;
        });
        trashList.innerHTML = html;
        trashList.querySelectorAll('.restore-btn').forEach(btn => btn.addEventListener('click', () => { const id = btn.dataset
            .id;
          restoreNote(id); }));
        trashList.querySelectorAll('.delete-forever-btn').forEach(btn => btn.addEventListener('click', () => { const id =
            btn.dataset.id; if (confirm('Permanently delete this note? This cannot be undone.')) deleteForever(id); }));
      }
      trashView.classList.add('active');
      dashboardView.classList.remove('active');
      notesGrid.style.display = 'none';
      searchInput.style.display = 'none';
    }

    // ================================================================
    //  RENDER: NOTES GRID with link embeds
    // ================================================================
    async function renderNotes() {
      if (!currentUser) {
        notesGrid.className = 'notes-grid empty';
        notesGrid.innerHTML =
          `<div class="empty-icon"><i class="fas fa-pen-fancy"></i></div><div class="empty-text">Sign in to see your notes</div><div class="empty-sub">Your notes are securely stored</div>`;
        dashboardView.classList.remove('active');
        trashView.classList.remove('active');
        notesGrid.style.display = 'grid';
        searchInput.style.display = 'block';
        return;
      }

      cleanTrash();

      let active = allNotes.filter(n => !n.deletedAt);
      let filtered = active.filter(n => n.archived === showArchived);

      const q = searchQuery.trim().toLowerCase();
      if (q) {
        filtered = filtered.filter(n =>
          (n.title && n.title.toLowerCase().includes(q)) ||
          (n.content && n.content.toLowerCase().includes(q))
        );
      }

      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });

      const archiveCountVal = active.filter(n => n.archived).length;
      archiveCount.textContent = archiveCountVal;
      const trashCountVal = allNotes.filter(n => n.deletedAt).length;
      trashCount.textContent = trashCountVal;

      if (filtered.length === 0) {
        notesGrid.className = 'notes-grid empty';
        const msg = showArchived ? 'No archived notes' : (q ? 'No notes found' : 'Your notes will appear here');
        const sub = showArchived ? 'Unarchive to restore' : (q ? 'Try a different search' : 'Tap the + button to create one');
        notesGrid.innerHTML =
          `<div class="empty-icon"><i class="fas fa-${q ? 'search' : 'sticky-note'}"></i></div><div class="empty-text">${msg}</div><div class="empty-sub">${sub}</div>`;
        dashboardView.classList.remove('active');
        trashView.classList.remove('active');
        notesGrid.style.display = 'grid';
        searchInput.style.display = 'block';
        return;
      }

      notesGrid.className = 'notes-grid';
      let html = '';
      const isDark = currentTheme === 'dark';
      const defaultBg = isDark ? '#2d2d2d' : '#ffffff';

      // Build note cards with link embeds
      for (const note of filtered) {
        let bg = note.color;
        if (bg === null || bg === undefined || bg === '#ffffff' || bg === '') bg = defaultBg;
        const isDarkBg = isDarkColor(bg);
        const textColor = isDarkBg ? '#fff' : '#202124';
        const title = note.title || '';
        let content = note.content || '';
        const noteId = note.id;
        const hasImage = note.imageData && note.imageData.length > 0;
        const isList = note.type === 'list';
        const isDrawing = note.type === 'drawing';
        const isImage = note.type === 'image';

        // Detect URLs and fetch embeds
        const urls = content.match(/https?:\/\/[^\s<]+/g) || [];
        let embedHtml = '';
        if (urls.length > 0) {
          // Show embed for the first URL in the note content
          const firstUrl = urls[0];
          try {
            const preview = await fetchLinkPreview(firstUrl);
            const domain = new URL(firstUrl).hostname;
            embedHtml = `
              <div class="link-embed">
                <div class="link-image">
                  ${preview.image ? `<img src="${preview.image}" alt="" loading="lazy" />` : `<span class="no-img"><i class="fas fa-link"></i></span>`}
                </div>
                <div class="link-info">
                  <div class="link-title">${escHtml(preview.title || domain)}</div>
                  ${preview.description ? `<div class="link-desc">${escHtml(preview.description.substring(0, 120))}</div>` : ''}
                  <div class="link-domain">
                    <img src="${preview.favicon}" alt="" />
                    <a href="${firstUrl}" target="_blank" rel="noopener noreferrer">${domain}</a>
                  </div>
                </div>
              </div>
            `;
          } catch (_) {}
        }

        // Process content - remove URLs from displayed content (they're shown in embed)
        let displayContent = content;
        if (urls.length > 0) {
          // Remove the first URL from content to avoid duplication
          const firstUrl = urls[0];
          displayContent = displayContent.replace(firstUrl, '').trim();
        }

        // Type label
        let typeLabel = '';
        if (isList) typeLabel = '📋 List';
        else if (isDrawing) typeLabel = '🎨 Drawing';
        else if (isImage) typeLabel = '🖼️ Image';
        else typeLabel = '📝 Text';

        // List items rendering
        let listHtml = '';
        if (isList && content) {
          const items = content.split('\n').filter(s => s.trim());
          listHtml = `<div style="margin:4px 0;"><ul style="list-style:none;padding:0;">`;
          items.forEach(s => {
            listHtml +=
              `<li style="padding:2px 0;display:flex;align-items:center;gap:8px;font-size:14px;"><span style="display:inline-block;width:16px;height:16px;border:2px solid var(--text-muted);border-radius:50%;flex-shrink:0;"></span>${escHtml(s)}</li>`;
          });
          listHtml += `</ul></div>`;
          displayContent = '';
        }

        html += `
          <div class="note-card" data-id="${noteId}" style="background:${bg}; color:${textColor};">
            ${note.pinned ? `<div class="pin-badge"><i class="fas fa-thumbtack"></i></div>` : ''}
            <div class="card-actions">
              <button class="more-btn" data-id="${noteId}"><i class="fas fa-ellipsis-v"></i></button>
              <div class="card-menu" data-id="${noteId}" role="menu">
                <button class="menu-item" data-action="pin"><i class="fas fa-thumbtack"></i> ${note.pinned ? 'Unpin' : 'Pin'}</button>
                <button class="menu-item" data-action="color"><i class="fas fa-palette"></i> Change Color</button>
                <div class="color-picker-sub" style="display:none;"></div>
                <button class="menu-item" data-action="image"><i class="fas fa-image"></i> Add Image</button>
                <button class="menu-item" data-action="link"><i class="fas fa-link"></i> Copy Link</button>
                <button class="menu-item" data-action="share"><i class="fas fa-share-alt"></i> Share</button>
                <button class="menu-item" data-action="download"><i class="fas fa-download"></i> Download</button>
                ${note.archived ? `<button class="menu-item" data-action="unarchive"><i class="fas fa-undo"></i> Unarchive</button>` : `<button class="menu-item" data-action="archive"><i class="fas fa-archive"></i> Archive</button>`}
                <div class="menu-divider"></div>
                <button class="menu-item danger" data-action="delete"><i class="fas fa-trash"></i> Move to Trash</button>
              </div>
            </div>
            ${title ? `<div class="note-title">${escHtml(title)}</div>` : ''}
            ${hasImage && !isDrawing ? `<div class="note-image"><img src="${note.imageData}" alt="Note image" loading="lazy" /></div>` : ''}
            ${isDrawing && note.imageData ? `<div style="margin:6px 0 8px;border-radius:var(--radius-sm);overflow:hidden;background:#fff;border:1px solid var(--border-color);"><img src="${note.imageData}" alt="Drawing" style="width:100%;height:auto;max-height:140px;object-fit:contain;" /></div>` : ''}
            ${listHtml}
            ${!isList && !isDrawing && displayContent ? `<div class="note-content">${linkify(displayContent)}</div>` : ''}
            ${embedHtml}
            <div class="note-meta">
              <span class="note-date"><i class="far fa-clock"></i> ${formatDate(note.updatedAt || note.createdAt)}</span>
              ${note.archived ? '<span>📦</span>' : ''}
              <span class="note-type-badge">${typeLabel}</span>
            </div>
          </div>
        `;
      }
      notesGrid.innerHTML = html;

      // Attach events
      notesGrid.querySelectorAll('.note-card').forEach(card => {
        const id = card.dataset.id;
        const moreBtn = card.querySelector('.more-btn');
        const menu = card.querySelector('.card-menu');
        if (moreBtn && menu) {
          moreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.card-menu.open').forEach(m => { if (m !== menu) m.classList.remove('open'); });
            const isOpen = menu.classList.toggle('open');
            if (isOpen) {
              // Position menu near the button
              const rect = moreBtn.getBoundingClientRect();
              const menuHeight = Math.min(menu.scrollHeight, 380);
              const spaceBelow = window.innerHeight - rect.bottom;
              let top = rect.top + rect.height + 6;
              if (spaceBelow < menuHeight + 20) {
                top = rect.top - menuHeight - 6;
              }
              menu.style.top = Math.max(10, top) + 'px';
              menu.style.left = Math.min(rect.right - 210, window.innerWidth - 220) + 'px';
            }
            const colorSub = menu.querySelector('.color-picker-sub');
            if (colorSub) colorSub.style.display = 'none';
          });
        }
        card.querySelectorAll('.card-menu .menu-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            const action = item.dataset.action;
            const note = allNotes.find(n => n.id === id);
            if (!note) return;
            if (action === 'pin') { togglePin(note);
              menu.classList.remove('open'); } else if (action === 'color') {
              const colorSub = menu.querySelector('.color-picker-sub');
              if (colorSub) {
                const isVisible = colorSub.style.display !== 'none';
                colorSub.style.display = isVisible ? 'none' : 'flex';
                if (!isVisible && colorSub.children.length === 0) {
                  const defaultOpt = document.createElement('div');
                  defaultOpt.className = 'color-opt default-opt' + (note.color === null || note.color === '#ffffff' ?
                    ' active' : '');
                  defaultOpt.title = 'Default (theme)';
                  defaultOpt.dataset.color = 'null';
                  defaultOpt.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    changeNoteColor(note, null);
                    colorSub.style.display = 'none';
                    menu.classList.remove('open');
                  });
                  colorSub.appendChild(defaultOpt);
                  COLORS.filter(c => c.value !== null).forEach(c => {
                    const opt = document.createElement('div');
                    opt.className = 'color-opt' + (c.value === note.color ? ' active' : '');
                    opt.style.background = c.value;
                    if (c.value === '#ffffff') opt.style.border = '2px solid #dadce0';
                    opt.dataset.color = c.value;
                    opt.title = c.name;
                    opt.addEventListener('click', (ev) => {
                      ev.stopPropagation();
                      changeNoteColor(note, c.value);
                      colorSub.style.display = 'none';
                      menu.classList.remove('open');
                    });
                    colorSub.appendChild(opt);
                  });
                }
              }
            } else if (action === 'image') { uploadImageForNote(note);
              menu.classList.remove('open'); } else if (action === 'link') { copyNoteLink(note);
              menu.classList.remove('open'); } else if (action === 'share') { shareNote(note);
              menu.classList.remove('open'); } else if (action === 'download') { downloadNote(note);
              menu.classList.remove('open'); } else if (action === 'archive') { toggleArchive(note, true);
              menu.classList.remove('open'); } else if (action === 'unarchive') { toggleArchive(note, false);
              menu.classList.remove('open'); } else if (action === 'delete') { moveToTrash(note);
              menu.classList.remove('open'); }
          });
        });
        card.addEventListener('click', (e) => {
          if (e.target.closest('.card-actions') || e.target.closest('.note-image') || e.target.closest(
            '.link-embed') || e.target.closest('.note-meta')) return;
          openEditor(id);
        });
      });
      document.addEventListener('click', () => {
        document.querySelectorAll('.card-menu.open').forEach(m => m.classList.remove('open'));
      });

      dashboardView.classList.remove('active');
      trashView.classList.remove('active');
      notesGrid.style.display = 'grid';
      searchInput.style.display = 'block';
    }

    // ================================================================
    //  LINKIFY
    // ================================================================
    function linkify(text) {
      if (!text) return '';
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    }

    // ================================================================
    //  RENDER ALL
    // ================================================================
    async function renderAll() {
      if (showTrash) renderTrash();
      else if (showDashboard) renderDashboard();
      else await renderNotes();
      const active = allNotes.filter(n => !n.deletedAt);
      archiveCount.textContent = active.filter(n => n.archived).length;
      trashCount.textContent = allNotes.filter(n => n.deletedAt).length;
    }

    // ================================================================
    //  HELPERS
    // ================================================================
    function escHtml(str) { const div = document.createElement('div');
      div.textContent = str; return div.innerHTML; }

    function isDarkColor(hex) {
      if (!hex || hex === '#ffffff') return false;
      const c = hex.replace('#', '');
      const r = parseInt(c.substr(0, 2), 16) || 0;
      const g = parseInt(c.substr(2, 2), 16) || 0;
      const b = parseInt(c.substr(4, 2), 16) || 0;
      return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
      return d.toLocaleDateString();
    }

    // ================================================================
    //  NOTE ACTIONS
    // ================================================================
    async function togglePin(note) {
      note.pinned = !note.pinned;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast(note.pinned ? 'Pinned' : 'Unpinned', 'thumbtack');
    }

    async function changeNoteColor(note, color) {
      note.color = color;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast('Color updated', 'palette');
    }

    async function toggleArchive(note, archive) {
      note.archived = archive;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast(archive ? 'Archived' : 'Unarchived', 'archive');
    }

    async function moveToTrash(note) {
      if (!confirm('Move this note to Trash?')) return;
      note.deletedAt = Date.now();
      note.archived = false;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast('Moved to Trash', 'trash');
      if (editingNoteId === note.id) closeEditor();
    }

    async function restoreNote(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      delete note.deletedAt;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast('Restored from Trash', 'undo');
    }

    async function deleteForever(id) {
      allNotes = allNotes.filter(n => n.id !== id);
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast('Permanently deleted', 'trash-alt');
    }

    function downloadNote(note) {
      const content = (note.title ? note.title + '\n' : '') + (note.content || '');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (note.title || 'note') + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Downloaded', 'download');
    }

    function copyNoteLink(note) {
      const url = window.location.origin + window.location.pathname + '?note=' + encodeURIComponent(note.id);
      navigator.clipboard.writeText(url).then(() => showToast('Link copied!', 'link')).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Link copied!', 'link');
      });
    }

    function shareNote(note) {
      const text = (note.title ? note.title + '\n' : '') + (note.content || '');
      const url = window.location.origin + window.location.pathname + '?note=' + encodeURIComponent(note.id);
      if (navigator.share) {
        navigator.share({ title: note.title || 'Note', text: text, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text + '\n\n' + url).then(() => {
          showToast('Content & link copied!', 'share-alt');
        }).catch(() => showToast('Share: ' + url, 'share-alt'));
      }
    }

    function uploadImageForNote(note) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          note.imageData = ev.target.result;
          note.updatedAt = Date.now();
          await saveNotesToStorage(currentUser.id, allNotes);
          renderAll();
          showToast('Image added', 'image');
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    // ================================================================
    //  NOTE CRUD
    // ================================================================
    async function createNote(title, content, color, type = 'text', imageData = null) {
      const note = {
        id: Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6),
        title: title.trim() || '',
        content: content.trim() || '',
        color: color,
        pinned: false,
        archived: false,
        deletedAt: null,
        imageData: imageData,
        type: type,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      allNotes.unshift(note);
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      return note;
    }

    async function updateNote(id, title, content, color, imageData = null, type = null) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      note.title = (title || '').trim();
      note.content = (content || '').trim();
      note.color = color;
      if (imageData !== undefined && imageData !== null) note.imageData = imageData;
      if (type) note.type = type;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
    }

    // ================================================================
    //  EDITOR
    // ================================================================
    function openEditor(noteId) {
      const note = noteId ? allNotes.find(n => n.id === noteId) : null;
      editingNoteId = note ? note.id : null;

      editorImagePreview.style.display = 'none';
      drawingCanvasWrap.style.display = 'none';
      listItemsWrap.style.display = 'none';
      noteContentInput.style.display = 'none';
      noteContentInput.value = '';
      imageDataForEditor = null;
      drawingInitialized = false;

      let type = note ? (note.type || 'text') : currentNoteType;

      if (note) {
        editorModalTitle.textContent = 'Edit Note';
        noteTitleInput.value = note.title || '';
        selectedColor = note.color !== undefined ? note.color : DEFAULT_COLOR;
        editorDeleteBtn.style.display = 'inline-flex';

        if (type === 'drawing' && note.imageData) {
          drawingCanvasWrap.style.display = 'block';
          const ctx = drawingCanvas.getContext('2d');
          const img = new Image();
          img.onload = () => {
            drawingCanvas.width = img.width;
            drawingCanvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            drawingInitialized = true;
          };
          img.src = note.imageData;
          imageDataForEditor = note.imageData;
        } else if (type === 'list') {
          listItemsWrap.style.display = 'block';
          listItemsInput.value = note.content || '';
          noteContentInput.style.display = 'none';
        } else if (type === 'image' && note.imageData) {
          editorImagePreview.style.display = 'block';
          editorImagePreviewImg.src = note.imageData;
          imageDataForEditor = note.imageData;
          noteContentInput.value = note.content || '';
          noteContentInput.style.display = 'block';
          noteContentInput.placeholder = 'Caption (optional)';
        } else {
          noteContentInput.value = note.content || '';
          noteContentInput.style.display = 'block';
          noteContentInput.placeholder = 'Write your note...';
        }
      } else {
        editorModalTitle.textContent = 'New Note';
        noteTitleInput.value = '';
        selectedColor = DEFAULT_COLOR;
        editorDeleteBtn.style.display = 'none';

        if (type === 'drawing') {
          drawingCanvasWrap.style.display = 'block';
          const ctx = drawingCanvas.getContext('2d');
          drawingCanvas.width = drawingCanvas.clientWidth || 400;
          drawingCanvas.height = 300;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, drawingCanvas.width, drawingCanvas.height);
          ctx.strokeStyle = '#202124';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          drawingInitialized = true;
          initDrawing();
        } else if (type === 'list') {
          listItemsWrap.style.display = 'block';
          listItemsInput.value = '';
          noteContentInput.style.display = 'none';
        } else if (type === 'image') {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (ev) => {
                imageDataForEditor = ev.target.result;
                editorImagePreview.style.display = 'block';
                editorImagePreviewImg.src = imageDataForEditor;
              };
              reader.readAsDataURL(file);
            }
          };
          input.click();
          noteContentInput.style.display = 'block';
          noteContentInput.placeholder = 'Caption (optional)';
        } else {
          noteContentInput.style.display = 'block';
          noteContentInput.placeholder = 'Write your note...';
        }
      }

      currentNoteType = type;
      renderEditorColorPicker(selectedColor);
      editorModal.classList.add('active');
      setTimeout(() => noteTitleInput.focus(), 100);
    }

    function closeEditor() {
      editorModal.classList.remove('active');
      editingNoteId = null;
      editorImagePreview.style.display = 'none';
      drawingCanvasWrap.style.display = 'none';
      listItemsWrap.style.display = 'none';
      noteContentInput.style.display = 'block';
      noteContentInput.value = '';
    }

    function renderEditorColorPicker(selected) {
      editorColorPicker.innerHTML = '';
      const defaultOpt = document.createElement('div');
      defaultOpt.className = 'color-opt default-opt' + (selected === null || selected === '#ffffff' ? ' active' : '');
      defaultOpt.title = 'Default (theme)';
      defaultOpt.dataset.color = 'null';
      defaultOpt.addEventListener('click', () => {
        editorColorPicker.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
        defaultOpt.classList.add('active');
        selectedColor = null;
      });
      editorColorPicker.appendChild(defaultOpt);
      COLORS.filter(c => c.value !== null).forEach(c => {
        const el = document.createElement('div');
        el.className = 'color-opt' + (c.value === selected ? ' active' : '');
        el.style.background = c.value;
        if (c.value === '#ffffff') el.style.border = '2px solid #dadce0';
        el.dataset.color = c.value;
        el.title = c.name;
        el.addEventListener('click', () => {
          editorColorPicker.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
          el.classList.add('active');
          selectedColor = c.value;
        });
        editorColorPicker.appendChild(el);
      });
    }

    // ================================================================
    //  DRAWING
    // ================================================================
    function initDrawing() {
      const canvas = drawingCanvas;
      const ctx = canvas.getContext('2d');

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function endDraw(e) {
        e.preventDefault();
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);
      canvas.addEventListener('touchstart', startDraw);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', endDraw);

      if (!drawingInitialized) {
        canvas.width = canvas.clientWidth || 400;
        canvas.height = 300;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#202124';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        drawingInitialized = true;
      }
    }

    // ================================================================
    //  SAVE EDITOR
    // ================================================================
    async function saveEditor() {
      const title = noteTitleInput.value;
      let content = '';
      let imageData = null;
      let type = currentNoteType;

      if (type === 'drawing') {
        const canvas = drawingCanvas;
        if (canvas && drawingCanvasWrap.style.display !== 'none') {
          imageData = canvas.toDataURL('image/png');
          content = 'Drawing note';
        } else {
          showToast('Draw something first', 'exclamation-circle');
          return;
        }
      } else if (type === 'list') {
        content = listItemsInput.value;
      } else if (type === 'image') {
        content = noteContentInput.value;
        imageData = imageDataForEditor || null;
        if (!imageData && !editingNoteId) {
          showToast('Please select an image', 'exclamation-circle');
          return;
        }
      } else {
        content = noteContentInput.value;
      }

      if (!title.trim() && !content.trim() && !imageData) {
        showToast('Enter a title or content', 'exclamation-circle');
        return;
      }

      setLoading(true);
      try {
        if (editingNoteId) {
          const note = allNotes.find(n => n.id === editingNoteId);
          if (note) {
            note.title = title.trim() || '';
            note.content = content.trim() || '';
            note.color = selectedColor;
            if (imageData) note.imageData = imageData;
            note.type = type;
            note.updatedAt = Date.now();
            await saveNotesToStorage(currentUser.id, allNotes);
            renderAll();
            showToast('Updated', 'check-circle');
          }
        } else {
          await createNote(title, content, selectedColor, type, imageData);
          showToast('Created', 'check-circle');
        }
        closeEditor();
      } catch (err) {
        console.error('Save error:', err);
        showToast('Error saving', 'exclamation-circle');
      } finally {
        setLoading(false);
      }
    }

    // ================================================================
    //  ACCOUNT DROPDOWN
    // ================================================================
    function renderAccountDropdown() {
      if (!currentUser) {
        accountDropdown.innerHTML =
          `<button class="drop-item" id="dropSignIn"><span class="icon"><i class="fas fa-sign-in-alt"></i></span><span class="label">Sign in</span></button>`;
        const btn = accountDropdown.querySelector('#dropSignIn');
        if (btn) btn.addEventListener('click', () => {
          accountDropdown.classList.remove('open');
          signinOverlay.classList.add('active');
          try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        });
        return;
      }

      const initial = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U';
      const avatarHtml = currentUser.picture ? `<img src="${currentUser.picture}" alt="" />` : initial;

      accountDropdown.innerHTML = `
        <div class="drop-item" style="cursor:default;background:transparent;">
          <div class="item-avatar">${avatarHtml}</div>
          <div class="item-info"><div class="name">${escHtml(currentUser.name)}</div><div class="email">${escHtml(currentUser.email)}</div></div>
          <span class="item-check"><i class="fas fa-check-circle"></i></span>
        </div>
        <div class="divider"></div>
        <button class="drop-item" id="dropSwitchAccount"><span class="icon"><i class="fas fa-exchange-alt"></i></span><span class="label">Switch account</span></button>
        <div class="divider"></div>
        <button class="drop-item danger" id="dropSignOut"><span class="icon"><i class="fas fa-sign-out-alt"></i></span><span class="label">Sign out</span></button>
      `;

      accountDropdown.querySelector('#dropSwitchAccount')?.addEventListener('click', () => {
        accountDropdown.classList.remove('open');
        triggerAccountSwitch();
      });

      accountDropdown.querySelector('#dropSignOut')?.addEventListener('click', () => {
        accountDropdown.classList.remove('open');
        signOut();
      });
      accountBadge.textContent = '1';
    }

    // ================================================================
    //  LEFT DROPDOWN
    // ================================================================
    leftMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      leftDropdown.classList.toggle('open');
      accountDropdown.classList.remove('open');
    });

    leftAppearance.addEventListener('click', (e) => {
      e.stopPropagation();
      const sub = appearanceSub;
      sub.style.display = sub.style.display === 'block' ? 'none' : 'block';
    });

    themeToggleTrack.addEventListener('click', (e) => { e.stopPropagation();
      toggleTheme(); });

    leftArchive.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showArchived = !showArchived;
      if (showDashboard) showDashboard = false;
      if (showTrash) showTrash = false;
      renderAll();
      leftArchive.querySelector('.label').textContent = showArchived ? '📦 Archived (hide)' : 'Archived';
    });

    leftTrash.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showTrash = !showTrash;
      if (showTrash) { showDashboard = false;
        showArchived = false;
        leftArchive.querySelector('.label').textContent = 'Archived'; }
      renderAll();
    });

    leftDashboard.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showDashboard = !showDashboard;
      if (showDashboard) {
        showTrash = false;
        if (showArchived) { showArchived = false;
          leftArchive.querySelector('.label').textContent = 'Archived'; }
        renderDashboard();
        searchInput.style.display = 'none';
        notesGrid.style.display = 'none';
        trashView.classList.remove('active');
        dashboardView.classList.add('active');
      } else {
        dashboardView.classList.remove('active');
        searchInput.style.display = 'block';
        notesGrid.style.display = 'grid';
        renderAll();
      }
    });

    leftExport.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      if (!currentUser) { showToast('Sign in first', 'exclamation-circle'); return; }
      exportNotes();
    });

    leftImport.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      if (!currentUser) { showToast('Sign in first', 'exclamation-circle'); return; }
      importNotes();
    });

    leftAbout.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showToast('📝 Notes App — Built with ❤️, copyright free, version 2.0', 'info-circle', 4000);
    });

    document.addEventListener('click', () => { leftDropdown.classList.remove('open'); });
    leftDropdown.addEventListener('click', (e) => e.stopPropagation());

    // ================================================================
    //  EXPORT / IMPORT
    // ================================================================
    function exportNotes() {
      if (!allNotes.length) { showToast('No notes to export', 'exclamation-circle'); return; }
      const data = JSON.stringify(allNotes, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'notes_backup_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported', 'file-export');
    }

    function importNotes() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data) && data.length) {
              const existingIds = new Set(allNotes.map(n => n.id));
              const newNotes = data.filter(n => !existingIds.has(n.id));
              if (newNotes.length) {
                allNotes = [...allNotes, ...newNotes];
                await saveNotesToStorage(currentUser.id, allNotes);
                renderAll();
                showToast(`Imported ${newNotes.length} notes`, 'file-import');
              } else { showToast('No new notes to import', 'info-circle'); }
            } else { showToast('Invalid file', 'exclamation-circle'); }
          } catch (err) { console.error('Import error:', err);
            showToast('Error importing', 'exclamation-circle'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ================================================================
    //  FAB
    // ================================================================
    fabBtn.addEventListener('click', () => {
      if (!currentUser) {
        showToast('Please sign in first', 'exclamation-circle');
        signinOverlay.classList.add('active');
        try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        return;
      }
      fabMenu.classList.toggle('open');
    });

    fabMenu.querySelectorAll('.fab-option').forEach(option => {
      option.addEventListener('click', () => {
        const type = option.dataset.type;
        fabMenu.classList.remove('open');
        currentNoteType = type;
        openEditor(null);
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.fab-wrapper')) fabMenu.classList.remove('open');
    });

    // ================================================================
    //  RENDER APP
    // ================================================================
    function renderApp() {
      if (!currentUser) {
        signinOverlay.classList.add('active');
        notesGrid.className = 'notes-grid empty';
        notesGrid.innerHTML =
          `<div class="empty-icon"><i class="fas fa-pen-fancy"></i></div><div class="empty-text">Sign in to see your notes</div><div class="empty-sub">Your notes are securely stored</div>`;
        avatarLetter.textContent = 'G';
        accountBadge.textContent = '0';
        accountDropdown.innerHTML = '';
        dashboardView.classList.remove('active');
        trashView.classList.remove('active');
        searchInput.style.display = 'block';
        notesGrid.style.display = 'grid';
        setTimeout(() => { if (gsiBtn.children.length === 0) fallbackBtn.classList.add('visible'); }, 1000);
        return;
      }
      signinOverlay.classList.remove('active');
      const initial = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U';
      if (currentUser.picture) { avatarLetter.innerHTML = `<img src="${currentUser.picture}" alt="" />`; } else { avatarLetter
          .textContent = initial; }
      showArchived = false;
      showDashboard = false;
      showTrash = false;
      leftArchive.querySelector('.label').textContent = 'Archived';
      renderAll();
      renderAccountDropdown();
      accountBadge.textContent = '1';
    }

    // ================================================================
    //  SEARCH
    // ================================================================
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      if (!showDashboard && !showTrash) {
        renderAll();
      }
    });

    // ================================================================
    //  EDITOR EVENTS
    // ================================================================
    editorSaveBtn.addEventListener('click', saveEditor);
    editorCancelBtn.addEventListener('click', closeEditor);
    editorCloseBtn.addEventListener('click', closeEditor);
    editorDeleteBtn.addEventListener('click', () => {
      if (editingNoteId) {
        const note = allNotes.find(n => n.id === editingNoteId);
        if (note) moveToTrash(note);
        closeEditor();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (editorModal.classList.contains('active')) closeEditor();
        if (accountDropdown.classList.contains('open')) accountDropdown.classList.remove('open');
        if (leftDropdown.classList.contains('open')) leftDropdown.classList.remove('open');
        if (fabMenu.classList.contains('open')) fabMenu.classList.remove('open');
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        if (editorModal.classList.contains('active')) { e.preventDefault();
          saveEditor(); }
      }
    });

    // ================================================================
    //  AVATAR
    // ================================================================
    avatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentUser) {
        signinOverlay.classList.add('active');
        try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        return;
      }
      accountDropdown.classList.toggle('open');
      if (accountDropdown.classList.contains('open')) renderAccountDropdown();
      leftDropdown.classList.remove('open');
    });
    document.addEventListener('click', () => { accountDropdown.classList.remove('open'); });
    accountDropdown.addEventListener('click', (e) => e.stopPropagation());

    // ================================================================
    //  REFRESH
    // ================================================================
    refreshBtn.addEventListener('click', async () => {
      if (!currentUser) { showToast('Sign in first', 'exclamation-circle'); return; }
      setLoading(true);
      try {
        allNotes = await loadNotesFromStorage(currentUser.id);
        linkEmbedCache = {};
        renderAll();
        showToast('Refreshed', 'sync-alt');
      } catch (err) { console.error('Refresh error:', err);
        showToast('Error refreshing', 'exclamation-circle'); } finally { setLoading(false); }
    });

    // ================================================================
    //  FALLBACK
    // ================================================================
    fallbackBtn.addEventListener('click', () => {
      try { if (typeof google !== 'undefined' && google.accounts) { google.accounts.id.prompt(); return; } } catch (_) {}
      const redirectUri = window.location.origin + window.location.pathname;
      const finalRedirect = (window.location.hostname === 'notes.flatfusion.fun') ?
        'https://notes.flatfusion.fun/callback' :
        window.location.origin + window.location.pathname;
      const authUrl =
        `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(finalRedirect)}&response_type=token&scope=openid%20profile%20email&prompt=select_account`;
      const popup = window.open(authUrl, 'google_signin', 'width=500,height=600,resizable=yes,scrollbars=yes');
      if (!popup) { showToast('Popup blocked', 'exclamation-circle'); return; }
      const timer = setInterval(() => {
        try {
          const url = popup.location.href;
          if (url.includes('id_token=') || url.includes('access_token=')) {
            clearInterval(timer);
            const hash = popup.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token') || params.get('access_token');
            if (idToken) {
              const payload = JSON.parse(atob(idToken.split('.')[1]));
              handleUserSignIn({
                id: payload.sub,
                name: payload.name || 'User',
                email: payload.email || '',
                picture: payload.picture || '',
              });
            }
            popup.close();
          }
        } catch (_) {}
      }, 300);
      const checkClosed = setInterval(() => { if (popup.closed) { clearInterval(checkClosed);
          clearInterval(timer); } }, 500);
    });

    // ================================================================
    //  INIT
    // ================================================================
    async function init() {
      setLoading(true);
      try {
        loadTheme();
        const storedUser = loadUserFromStorage();
        if (storedUser) {
          currentUser = storedUser;
          allNotes = await loadNotesFromStorage(storedUser.id);
          initGoogleSignIn();
          renderApp();
          setTimeout(() => { try { google.accounts.id.prompt(); } catch (_) {} }, 1000);
        } else {
          signinOverlay.classList.add('active');
          initGoogleSignIn();
          renderApp();
        }
      } catch (err) { console.error('Init error:', err);
        showToast('Error loading app', 'exclamation-circle'); } finally {
        setTimeout(() => setLoading(false), 2000);
        setLoading(false);
      }
    }

    function handleUrlNote() {
      const params = new URLSearchParams(window.location.search);
      const noteId = params.get('note');
      if (noteId && currentUser) {
        const note = allNotes.find(n => n.id === noteId);
        if (note) {
          setTimeout(() => { openEditor(noteId);
            showToast('Opening shared note...', 'link'); }, 500);
        }
      }
    }

    window.addEventListener('popstate', handleUrlNote);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { init();
        setTimeout(handleUrlNote, 800); });
    } else { init();
      setTimeout(handleUrlNote, 800); }

    setTimeout(() => {
      if (gsiBtn.children.length === 0) fallbackBtn.classList.add('visible');
      if (typeof google === 'undefined' || !google.accounts) fallbackBtn.classList.add('visible');
    }, 4000);

    console.log('📝 Notes App — Fully fixed with all features');
    console.log('✅ Three-dot menu positions dynamically');
    console.log('✅ Drawing works with touch/mouse');
    console.log('✅ List notes with checkboxes');
    console.log('✅ Link embeds with OG data and favicon');
    console.log('✅ Public option removed');
  </script>
</body>
</html>
