<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keep – Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ============================================================
       ROOT VARIABLES — Google Keep Style
       ============================================================ */
    :root {
      --bg-app: #f5f7fa;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --bg-input: #f1f3f4;
      --bg-hover: #f1f3f4;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-muted: #9aa0a6;
      --border-color: #e0e0e0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --accent-bg: #e8f0fe;
      --danger: #d93025;
      --danger-bg: #fce8e6;
      --warning: #fbbc04;
      --success: #34a853;
      --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --font: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --max-width: 1320px;
    }

    [data-theme="dark"] {
      --bg-app: #1e1e1e;
      --bg-card: #2d2d2d;
      --bg-header: #252525;
      --bg-input: #3d3d3d;
      --bg-hover: #3d3d3d;
      --text-primary: #e8eaed;
      --text-secondary: #b0b3b8;
      --text-muted: #7a7f85;
      --border-color: #3d3d3d;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
      --accent: #8ab4f8;
      --accent-hover: #6a9fdf;
      --accent-bg: #1e2a3a;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: var(--font);
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 999px;
    }

    /* ===== LOADING ===== */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-app);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }
    #loadingOverlay.active {
      display: flex;
    }
    #loadingOverlay .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #loadingOverlay .load-text {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.2px;
      animation: pulse-text 1.4s ease-in-out infinite;
    }
    @keyframes pulse-text {
      0%,
      100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    /* ===== TOAST ===== */
    #toastContainer {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 100%;
      max-width: 400px;
    }
    .toast-item {
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      border: 1px solid var(--border-color);
      text-align: center;
      max-width: 90vw;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast-item.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ===== SIGN-IN OVERLAY ===== */
    #signinOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg-app);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #signinOverlay.active {
      display: flex;
    }
    .signin-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      animation: popIn 0.35s ease;
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .signin-card .logo-icon {
      font-size: 52px;
      color: var(--warning);
      margin-bottom: 8px;
    }
    .signin-card h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .signin-card p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .signin-card .gsi-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 56px;
    }
    .signin-card .gsi-container #gsiBtn {
      min-height: 44px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .signin-card .gsi-container .fallback-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
      width: 100%;
      max-width: 280px;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .signin-card .gsi-container .fallback-btn:hover {
      background: var(--bg-input);
    }
    .signin-card .gsi-container .fallback-btn.visible {
      display: flex;
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--bg-header);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 64px;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .header-left .menu-icon {
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: var(--transition);
    }
    .header-left .menu-icon:hover {
      background: var(--bg-hover);
    }
    .header-left .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .header-left .brand i {
      font-size: 26px;
      color: var(--warning);
    }

    /* Left dropdown */
    .left-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 6px 0;
      min-width: 220px;
      display: none;
      z-index: 150;
      border: 1px solid var(--border-color);
      animation: slideDown 0.2s ease;
    }
    .left-dropdown.open {
      display: block;
    }
    .left-dropdown .drop-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 18px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-size: 14px;
      font-family: var(--font);
    }
    .left-dropdown .drop-item:hover {
      background: var(--bg-hover);
    }
    .left-dropdown .drop-item i {
      width: 20px;
      color: var(--text-secondary);
      font-size: 16px;
    }
    .left-dropdown .drop-item .label {
      flex: 1;
    }
    .left-dropdown .drop-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 16px;
    }

    /* Appearance */
    .left-dropdown .appearance-wrap {
      padding: 0 18px 8px 18px;
    }
    .left-dropdown .appearance-wrap .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .left-dropdown .appearance-wrap .theme-row .theme-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-primary);
    }
    .left-dropdown .appearance-wrap .theme-row .theme-label i {
      width: 18px;
      color: var(--text-secondary);
    }
    .left-dropdown .toggle-track {
      width: 40px;
      height: 22px;
      background: var(--border-color);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .left-dropdown .toggle-track .toggle-thumb {
      width: 18px;
      height: 18px;
      background: var(--bg-card);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .left-dropdown .toggle-track.active {
      background: var(--accent);
    }
    .left-dropdown .toggle-track.active .toggle-thumb {
      left: 20px;
    }

    /* ===== HEADER CENTER ===== */
    .header-center {
      flex: 1;
      max-width: 680px;
      margin: 0 16px;
      position: relative;
    }
    .header-center .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }
    .header-center #searchInput {
      width: 100%;
      padding: 10px 16px 10px 44px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--bg-input);
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
      font-family: var(--font);
    }
    .header-center #searchInput:focus {
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
    }
    .header-center #searchInput::placeholder {
      color: var(--text-muted);
    }

    /* ===== HEADER RIGHT ===== */
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .header-right .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .header-right .icon-btn:hover {
      background: var(--bg-hover);
    }

    .avatar-wrap {
      position: relative;
      cursor: pointer;
    }
    .avatar-wrap .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      overflow: hidden;
      transition: var(--transition);
      border: 2px solid transparent;
      position: relative;
    }
    .avatar-wrap .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-wrap .avatar:hover {
      filter: brightness(0.95);
    }
    .avatar-wrap .avatar .badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-header);
    }

    /* Account Dropdown */
    .account-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 320px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 10px 0;
      display: none;
      z-index: 200;
      border: 1px solid var(--border-color);
      animation: slideDown 0.2s ease;
    }
    .account-dropdown.open {
      display: block;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .account-dropdown .drop-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      color: var(--text-primary);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-size: 14px;
      font-family: var(--font);
    }
    .account-dropdown .drop-item:hover {
      background: var(--bg-hover);
    }
    .account-dropdown .drop-item .item-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account-dropdown .drop-item .item-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .account-dropdown .drop-item .item-info {
      flex: 1;
      min-width: 0;
    }
    .account-dropdown .drop-item .item-info .name {
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-dropdown .drop-item .item-info .email {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-dropdown .drop-item .item-check {
      color: var(--accent);
      font-size: 16px;
    }
    .account-dropdown .divider {
      height: 1px;
      background: var(--border-color);
      margin: 6px 16px;
    }
    .account-dropdown .drop-item .icon {
      width: 24px;
      color: var(--text-secondary);
      font-size: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .account-dropdown .drop-item .label {
      flex: 1;
    }
    .account-dropdown .drop-item.danger .label {
      color: var(--danger);
    }
    .account-dropdown .drop-item.danger:hover {
      background: var(--danger-bg);
    }

    /* ===== MAIN ===== */
    .main-content {
      flex: 1;
      padding: 24px 32px 90px;
      max-width: var(--max-width);
      margin: 0 auto;
      width: 100%;
      transition: padding 0.3s ease;
    }

    /* ===== DASHBOARD VIEW ===== */
    .dashboard-view {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .dashboard-view.active {
      display: block;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .dashboard-view .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .dashboard-view .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .dashboard-view .stat-card:hover {
      box-shadow: var(--shadow-md);
    }
    .dashboard-view .stat-card .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .dashboard-view .stat-card .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .dashboard-view .stat-card .stat-icon {
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .dashboard-view .recent-notes {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .dashboard-view .recent-notes h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dashboard-view .recent-notes .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dashboard-view .recent-notes .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }
    .dashboard-view .recent-notes .recent-item:last-child {
      border-bottom: none;
    }
    .dashboard-view .recent-notes .recent-item .recent-title {
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .dashboard-view .recent-notes .recent-item .recent-date {
      color: var(--text-muted);
      font-size: 12px;
    }
    .dashboard-view .color-distribution {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .dashboard-view .color-distribution .color-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 6px;
      border-radius: 999px;
      background: var(--bg-input);
      font-size: 13px;
    }
    .dashboard-view .color-distribution .color-chip .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
    }

    /* ===== NOTES GRID ===== */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .notes-grid.empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--text-secondary);
      text-align: center;
    }
    .notes-grid.empty .empty-icon {
      font-size: 64px;
      color: var(--text-muted);
      opacity: 0.3;
      margin-bottom: 16px;
    }
    .notes-grid.empty .empty-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .notes-grid.empty .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ===== NOTE CARD ===== */
    .note-card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 16px 18px 12px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      position: relative;
      word-wrap: break-word;
      overflow: visible; /* FIX: allow dropdown to show */
      min-height: 100px;
      max-height: 500px;
      cursor: default;
    }
    .note-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .note-card .note-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
      word-break: break-word;
    }
    .note-card .note-content {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      max-height: 300px;
    }
    .note-card .note-content a {
      color: var(--accent);
      text-decoration: underline;
      word-break: break-all;
    }
    .note-card .note-content a:hover {
      text-decoration: none;
    }
    .note-card .note-content:empty {
      display: none;
    }
    .note-card .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

  <script>
    // ================================================================
    //  CONFIG
    // ================================================================
    const CLIENT_ID = '809488850172-uoj4sa9gcuomddbekb5sj525ulldp0fa.apps.googleusercontent.com';
    const STORAGE_KEY_PREFIX = 'keep_notes_';
    const USER_KEY = 'keep_user';
    const THEME_KEY = 'keep_theme';

    const COLORS = [
      { name: 'Default', value: null },
      { name: 'White', value: '#ffffff' },
      { name: 'Red', value: '#f28b82' },
      { name: 'Orange', value: '#fbbc04' },
      { name: 'Yellow', value: '#fff475' },
      { name: 'Green', value: '#ccff90' },
      { name: 'Teal', value: '#a7ffeb' },
      { name: 'Blue', value: '#cbf0f8' },
      { name: 'Dark Blue', value: '#aecbfa' },
      { name: 'Purple', value: '#d7aefb' },
      { name: 'Pink', value: '#fdcfe8' },
      { name: 'Brown', value: '#e6c9a8' },
      { name: 'Gray', value: '#e8eaed' },
    ];
    const DEFAULT_COLOR = null;

    // ================================================================
    //  STATE
    // ================================================================
    let currentUser = null;
    let allNotes = [];
    let editingNoteId = null;
    let selectedColor = DEFAULT_COLOR;
    let searchQuery = '';
    let currentTheme = 'light';
    let gsiInited = false;
    let showArchived = false;
    let showDashboard = false;

    // ================================================================
    //  DOM REFS
    // ================================================================
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const loadingOverlay = $('#loadingOverlay');
    const signinOverlay = $('#signinOverlay');
    const gsiBtn = $('#gsiBtn');
    const fallbackBtn = $('#fallbackBtn');
    const notesGrid = $('#notesGrid');
    const dashboardView = $('#dashboardView');
    const statsGrid = $('#statsGrid');
    const recentList = $('#recentList');
    const searchInput = $('#searchInput');
    const fabBtn = $('#fabBtn');
    const avatarBtn = $('#avatarBtn');
    const avatarLetter = $('#avatarLetter');
    const accountBadge = $('#accountBadge');
    const accountDropdown = $('#accountDropdown');
    const editorModal = $('#editorModal');
    const editorModalTitle = $('#editorModalTitle');
    const noteTitleInput = $('#noteTitleInput');
    const noteContentInput = $('#noteContentInput');
    const editorColorPicker = $('#editorColorPicker');
    const editorSaveBtn = $('#editorSaveBtn');
    const editorCancelBtn = $('#editorCancelBtn');
    const editorDeleteBtn = $('#editorDeleteBtn');
    const editorCloseBtn = $('#editorCloseBtn');
    const refreshBtn = $('#refreshBtn');
    const toastContainer = $('#toastContainer');
    const leftMenuBtn = $('#leftMenuBtn');
    const leftDropdown = $('#leftDropdown');
    const leftAppearance = $('#leftAppearance');
    const appearanceSub = $('#appearanceSub');
    const themeToggleTrack = $('#themeToggleTrack');
    const leftExport = $('#leftExport');
    const leftImport = $('#leftImport');
    const leftAbout = $('#leftAbout');
    const leftArchive = $('#leftArchive');
    const leftDashboard = $('#leftDashboard');
    const archiveCount = $('#archiveCount');

    // ================================================================
    //  TOAST — single instance, no duplicates
    // ================================================================
    let toastTimer = null;
    let toastEl = null;

    function showToast(msg, icon = 'info-circle', duration = 2800) {
      if (toastEl) {
        toastEl.classList.remove('show');
        setTimeout(() => {
          if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
          toastEl = null;
        }, 100);
        clearTimeout(toastTimer);
      }

      toastEl = document.createElement('div');
      toastEl.className = 'toast-item';
      toastEl.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
      toastContainer.appendChild(toastEl);
      requestAnimationFrame(() => toastEl.classList.add('show'));

      toastTimer = setTimeout(() => {
        if (toastEl) {
          toastEl.classList.remove('show');
          setTimeout(() => {
            if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
            toastEl = null;
          }, 400);
        }
      }, duration);
    }

    // ================================================================
    //  LOADING
    // ================================================================
    function setLoading(active) {
      loadingOverlay.classList.toggle('active', active);
    }

    // ================================================================
    //  THEME
    // ================================================================
    function loadTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        currentTheme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) { currentTheme = 'light'; }
      applyTheme();
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', currentTheme);
      const isDark = currentTheme === 'dark';
      if (themeToggleTrack) {
        themeToggleTrack.classList.toggle('active', isDark);
      }
      try { localStorage.setItem(THEME_KEY, currentTheme); } catch (_) {}
      renderAll();
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme();
      showToast(currentTheme === 'dark' ? 'Dark mode' : 'Light mode', 'palette');
    }

    // ================================================================
    //  STORAGE
    // ================================================================
    function getStorageKey(userId) { return STORAGE_KEY_PREFIX + userId; }

    async function loadNotesFromStorage(userId) {
      try {
        const raw = localStorage.getItem(getStorageKey(userId));
        return raw ? JSON.parse(raw) : [];
      } catch (_) { return []; }
    }

    async function saveNotesToStorage(userId, notes) {
      try { localStorage.setItem(getStorageKey(userId), JSON.stringify(notes)); } catch (_) {}
    }

    function saveUserToStorage(user) { try { localStorage.setItem(USER_KEY, JSON.stringify(user)); } catch (_) {} }

    function loadUserFromStorage() {
      try {
        const raw = localStorage.getItem(USER_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }

    function clearUserStorage() { try { localStorage.removeItem(USER_KEY); } catch (_) {} }

    // ================================================================
    //  AUTH
    // ================================================================
    function initGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleSignIn, 300);
        return;
      }
      if (gsiInited) return;
      gsiInited = true;

      try {
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse,
          prompt: 'select_account',
          cancel_on_tap_outside: false,
          context: 'signin',
        });
        google.accounts.id.renderButton(gsiBtn, {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: 280,
        });
        setTimeout(() => {
          if (gsiBtn.children.length === 0) fallbackBtn.classList.add('visible');
        }, 2000);
        setTimeout(() => {
          try { google.accounts.id.prompt(); } catch (_) {}
        }, 600);
      } catch (err) {
        console.error('GIS init error:', err);
        fallbackBtn.classList.add('visible');
      }
    }

    function handleCredentialResponse(response) {
      if (!response.credential) return;
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        handleUserSignIn({
          id: payload.sub,
          name: payload.name || 'User',
          email: payload.email || '',
          picture: payload.picture || '',
        });
      } catch (err) {
        console.error('Credential parse error:', err);
        showToast('Sign-in failed', 'exclamation-circle');
      }
    }

    async function handleUserSignIn(user) {
      setLoading(true);
      try {
        currentUser = user;
        saveUserToStorage(user);
        allNotes = await loadNotesFromStorage(user.id);
        signinOverlay.classList.remove('active');
        showDashboard = false;
        renderApp();
        showToast(`Welcome, ${user.name}!`, 'check-circle');
        setTimeout(() => {
          try { google.accounts.id.prompt(); } catch (_) {}
        }, 500);
      } catch (err) {
        console.error('Sign-in error:', err);
        showToast('Error signing in', 'exclamation-circle');
      } finally {
        setLoading(false);
      }
    }

    // ================================================================
    //  SWITCH ACCOUNT — FIXED with robust retry
    // ================================================================
    function triggerAccountSwitch() {
      try {
        if (typeof google !== 'undefined' && google.accounts) {
          // Disable auto-select to force prompt
          google.accounts.id.disableAutoSelect();
          // Re-initialize with fresh config to avoid session conflicts
          google.accounts.id.initialize({
            client_id: CLIENT_ID,
            callback: handleCredentialResponse,
            prompt: 'select_account',
            cancel_on_tap_outside: false,
            context: 'signin',
          });
          // Show the prompt
          google.accounts.id.prompt();
          showToast('Select an account to switch', 'exchange-alt');
        } else {
          // Fallback: sign out and show sign-in
          signOut();
          signinOverlay.classList.add('active');
          fallbackBtn.classList.add('visible');
          showToast('Please sign in again', 'info-circle');
        }
      } catch (err) {
        console.error('Switch account error:', err);
        // Last resort: sign out
        signOut();
        signinOverlay.classList.add('active');
        fallbackBtn.classList.add('visible');
        showToast('Unable to switch, please sign in again', 'exclamation-circle');
      }
    }

    // ================================================================
    //  SIGN OUT
    // ================================================================
    async function signOut() {
      setLoading(true);
      try {
        currentUser = null;
        clearUserStorage();
        try { google.accounts.id.disableAutoSelect(); } catch (_) {}
        allNotes = [];
        signinOverlay.classList.add('active');
        renderApp();
        showToast('Signed out', 'sign-out-alt');
        fallbackBtn.classList.remove('visible');
        setTimeout(() => {
          try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        }, 500);
      } catch (err) {
        console.error('Sign out error:', err);
        showToast('Error signing out', 'exclamation-circle');
      } finally {
        setLoading(false);
      }
    }

    // ================================================================
    //  RENDER: DASHBOARD
    // ================================================================
    function renderDashboard() {
      if (!currentUser) return;
      const total = allNotes.length;
      const pinned = allNotes.filter(n => n.pinned).length;
      const archived = allNotes.filter(n => n.archived).length;
      const colors = {};
      allNotes.forEach(n => {
        const c = n.color || 'default';
        colors[c] = (colors[c] || 0) + 1;
      });
      const colorEntries = Object.entries(colors).sort((a, b) => b[1] - a[1]);

      statsGrid.innerHTML = `
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-file-alt"></i></div><div class="stat-number">${total}</div><div class="stat-label">Total Notes</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-thumbtack"></i></div><div class="stat-number">${pinned}</div><div class="stat-label">Pinned</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-archive"></i></div><div class="stat-number">${archived}</div><div class="stat-label">Archived</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-palette"></i></div><div class="stat-number">${colorEntries.length}</div><div class="stat-label">Colors Used</div></div>
      `;

      const recent = [...allNotes].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 5);
      if (recent.length === 0) {
        recentList.innerHTML = `<div style="color:var(--text-muted);padding:8px 0;">No notes yet.</div>`;
      } else {
        let html = '';
        recent.forEach(n => {
          const title = n.title || 'Untitled';
          const date = formatDate(n.updatedAt || n.createdAt);
          html += `
            <div class="recent-item">
              <span class="recent-title">${escHtml(title)}</span>
              <span class="recent-date">${date}</span>
            </div>
          `;
        });
        recentList.innerHTML = html;
      }

      if (colorEntries.length > 0) {
        let colorHtml = '<div class="color-distribution">';
        colorEntries.forEach(([color, count]) => {
          const swatch = color === 'default' ? 'conic-gradient(white 50%, #ccc 50%)' : color;
          colorHtml += `
            <span class="color-chip">
              <span class="color-swatch" style="background:${swatch};"></span>
              ${count}
            </span>
          `;
        });
        colorHtml += '</div>';
        const extra = document.createElement('div');
        extra.className = 'stat-card';
        extra.innerHTML = `<div class="stat-icon"><i class="fas fa-chart-bar"></i></div><div class="stat-label">Color Distribution</div>${colorHtml}`;
        statsGrid.appendChild(extra);
      }

      dashboardView.classList.add('active');
      notesGrid.style.display = 'none';
      searchInput.style.display = 'none';
    }

    // ================================================================
    //  RENDER: NOTES GRID with clickable links and image support
    // ================================================================
    function renderNotes() {
      if (!currentUser) {
        notesGrid.className = 'notes-grid empty';
        notesGrid.innerHTML = `
          <div class="empty-icon"><i class="fas fa-pen-fancy"></i></div>
          <div class="empty-text">Sign in to see your notes</div>
          <div class="empty-sub">Your notes are securely stored</div>
        `;
        dashboardView.classList.remove('active');
        notesGrid.style.display = 'grid';
        searchInput.style.display = 'block';
        return;
      }

      let filtered = allNotes.filter(n => n.archived === showArchived);
      const q = searchQuery.trim().toLowerCase();
      if (q) {
        filtered = filtered.filter(n =>
          (n.title && n.title.toLowerCase().includes(q)) ||
          (n.content && n.content.toLowerCase().includes(q))
        );
      }
      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });

      const archiveCountVal = allNotes.filter(n => n.archived).length;
      archiveCount.textContent = archiveCountVal;

      if (filtered.length === 0) {
        notesGrid.className = 'notes-grid empty';
        const msg = showArchived ? 'No archived notes' : (q ? 'No notes found' : 'Your notes will appear here');
        const sub = showArchived ? 'Unarchive to restore' : (q ? 'Try a different search' : 'Tap the + button to create one');
        notesGrid.innerHTML = `
          <div class="empty-icon"><i class="fas fa-${q ? 'search' : 'sticky-note'}"></i></div>
          <div class="empty-text">${msg}</div>
          <div class="empty-sub">${sub}</div>
        `;
        dashboardView.classList.remove('active');
        notesGrid.style.display = 'grid';
        searchInput.style.display = 'block';
        return;
      }

      notesGrid.className = 'notes-grid';
      let html = '';
      const isDark = currentTheme === 'dark';
      const defaultBg = isDark ? '#2d2d2d' : '#ffffff';

      filtered.forEach(note => {
        let bg = note.color;
        if (bg === null || bg === undefined || bg === '#ffffff' || bg === '') {
          bg = defaultBg;
        }
        const isDarkBg = isDarkColor(bg);
        const textColor = isDarkBg ? '#fff' : '#202124';
        const title = note.title || '';
        let content = note.content || '';
        content = linkify(content);
        const noteId = note.id;
        const hasImage = note.imageData && note.imageData.length > 0;

        html += `
          <div class="note-card" data-id="${noteId}" style="background:${bg}; color:${textColor};">
            ${note.pinned ? `<div class="pin-badge"><i class="fas fa-thumbtack"></i></div>` : ''}
            <div class="card-actions">
              <button class="more-btn" data-id="${noteId}" aria-label="More options"><i class="fas fa-ellipsis-v"></i></button>
              <div class="card-menu" data-id="${noteId}" role="menu">
                <button class="menu-item" data-action="pin"><i class="fas fa-thumbtack"></i> ${note.pinned ? 'Unpin' : 'Pin'}</button>
                <button class="menu-item" data-action="color"><i class="fas fa-palette"></i> Change Color</button>
                <div class="color-picker-sub" style="display:none;"></div>
                <button class="menu-item" data-action="image"><i class="fas fa-image"></i> Add Image</button>
                <button class="menu-item" data-action="link"><i class="fas fa-link"></i> Copy Link</button>
                <button class="menu-item" data-action="share"><i class="fas fa-share-alt"></i> Share</button>
                <button class="menu-item" data-action="download"><i class="fas fa-download"></i> Download</button>
                ${note.archived ? `<button class="menu-item" data-action="unarchive"><i class="fas fa-undo"></i> Unarchive</button>` : `<button class="menu-item" data-action="archive"><i class="fas fa-archive"></i> Archive</button>`}
                <div class="menu-divider"></div>
                <button class="menu-item danger" data-action="delete"><i class="fas fa-trash"></i> Delete</button>
              </div>
            </div>
            ${title ? `<div class="note-title">${escHtml(title)}</div>` : ''}
            ${hasImage ? `<div class="note-image"><img src="${note.imageData}" alt="Note image" loading="lazy" /></div>` : ''}
            <div class="note-content">${content}</div>
            <div class="note-meta">
              <span class="note-date"><i class="far fa-clock"></i> ${formatDate(note.updatedAt || note.createdAt)}</span>
              ${note.archived ? '<span>📦</span>' : ''}
            </div>
          </div>
        `;
      });
      notesGrid.innerHTML = html;

      // Attach events
      notesGrid.querySelectorAll('.note-card').forEach(card => {
        const id = card.dataset.id;
        const moreBtn = card.querySelector('.more-btn');
        const menu = card.querySelector('.card-menu');
        if (moreBtn && menu) {
          moreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // Close any other open menus
            document.querySelectorAll('.card-menu.open').forEach(m => {
              if (m !== menu) m.classList.remove('open');
            });
            menu.classList.toggle('open');
            const colorSub = menu.querySelector('.color-picker-sub');
            if (colorSub) colorSub.style.display = 'none';
          });
        }
        card.querySelectorAll('.card-menu .menu-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            const action = item.dataset.action;
            const note = allNotes.find(n => n.id === id);
            if (!note) return;
            if (action === 'pin') { togglePin(note);
              menu.classList.remove('open'); } else if (action === 'color') {
              const colorSub = menu.querySelector('.color-picker-sub');
              if (colorSub) {
                const isVisible = colorSub.style.display !== 'none';
                colorSub.style.display = isVisible ? 'none' : 'flex';
                if (!isVisible && colorSub.children.length === 0) {
                  const defaultOpt = document.createElement('div');
                  defaultOpt.className = 'color-opt default-opt' + (note.color === null || note.color === '#ffffff' ?
                    ' active' : '');
                  defaultOpt.title = 'Default (theme)';
                  defaultOpt.dataset.color = 'null';
                  defaultOpt.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    changeNoteColor(note, null);
                    colorSub.style.display = 'none';
                    menu.classList.remove('open');
                  });
                  colorSub.appendChild(defaultOpt);
                  COLORS.filter(c => c.value !== null).forEach(c => {
                    const opt = document.createElement('div');
                    opt.className = 'color-opt' + (c.value === note.color ? ' active' : '');
                    opt.style.background = c.value;
                    if (c.value === '#ffffff') opt.style.border = '2px solid #dadce0';
                    opt.dataset.color = c.value;
                    opt.title = c.name;
                    opt.addEventListener('click', (ev) => {
                      ev.stopPropagation();
                      changeNoteColor(note, c.value);
                      colorSub.style.display = 'none';
                      menu.classList.remove('open');
                    });
                    colorSub.appendChild(opt);
                  });
                }
              }
            } else if (action === 'image') { uploadImageForNote(note);
              menu.classList.remove('open'); } else if (action === 'link') { copyNoteLink(note);
              menu.classList.remove('open'); } else if (action === 'share') { shareNote(note);
              menu.classList.remove('open'); } else if (action === 'download') { downloadNote(note);
              menu.classList.remove('open'); } else if (action === 'archive') { toggleArchive(note, true);
              menu.classList.remove('open'); } else if (action === 'unarchive') { toggleArchive(note, false);
              menu.classList.remove('open'); } else if (action === 'delete') { deleteNote(note.id);
              menu.classList.remove('open'); }
          });
        });
        card.addEventListener('click', (e) => {
          if (e.target.closest('.card-actions') || e.target.closest('.note-image') || e.target.closest(
            '.note-meta')) return;
          openEditor(id);
        });
      });
      document.addEventListener('click', () => {
        document.querySelectorAll('.card-menu.open').forEach(m => m.classList.remove('open'));
      });

      dashboardView.classList.remove('active');
      notesGrid.style.display = 'grid';
      searchInput.style.display = 'block';
    }

    // ================================================================
    //  LINKIFY — convert URLs to clickable links
    // ================================================================
    function linkify(text) {
      if (!text) return '';
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return text.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    // ================================================================
    //  RENDER ALL
    // ================================================================
    function renderAll() {
      if (showDashboard) {
        renderDashboard();
      } else {
        renderNotes();
      }
      const archiveCountVal = allNotes.filter(n => n.archived).length;
      archiveCount.textContent = archiveCountVal;
    }

    // ================================================================
    //  HELPERS
    // ================================================================
    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function isDarkColor(hex) {
      if (!hex || hex === '#ffffff') return false;
      const c = hex.replace('#', '');
      const r = parseInt(c.substr(0, 2), 16) || 0;
      const g = parseInt(c.substr(2, 2), 16) || 0;
      const b = parseInt(c.substr(4, 2), 16) || 0;
      return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
      return d.toLocaleDateString();
    }

    // ================================================================
    //  NOTE ACTIONS
    // ================================================================
    async function togglePin(note) {
      note.pinned = !note.pinned;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast(note.pinned ? 'Pinned' : 'Unpinned', 'thumbtack');
    }

    async function changeNoteColor(note, color) {
      note.color = color;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast('Color updated', 'palette');
    }

    async function toggleArchive(note, archive) {
      note.archived = archive;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast(archive ? 'Archived' : 'Unarchived', 'archive');
    }

    function downloadNote(note) {
      const content = (note.title ? note.title + '\n' : '') + (note.content || '');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (note.title || 'note') + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Downloaded', 'download');
    }

    function copyNoteLink(note) {
      const url = window.location.origin + window.location.pathname + '?note=' + encodeURIComponent(note.id);
      navigator.clipboard.writeText(url).then(() => showToast('Link copied!', 'link')).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Link copied!', 'link');
      });
    }

    function shareNote(note) {
      const text = (note.title ? note.title + '\n' : '') + (note.content || '');
      const url = window.location.origin + window.location.pathname + '?note=' + encodeURIComponent(note.id);
      if (navigator.share) {
        navigator.share({ title: note.title || 'Note', text: text, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text + '\n\n' + url).then(() => {
          showToast('Content & link copied!', 'share-alt');
        }).catch(() => showToast('Share: ' + url, 'share-alt'));
      }
    }

    function uploadImageForNote(note) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          note.imageData = ev.target.result;
          note.updatedAt = Date.now();
          await saveNotesToStorage(currentUser.id, allNotes);
          renderAll();
          showToast('Image added', 'image');
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    // ================================================================
    //  NOTE CRUD
    // ================================================================
    async function createNote(title, content, color) {
      const note = {
        id: Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6),
        title: title.trim() || '',
        content: content.trim() || '',
        color: color,
        pinned: false,
        archived: false,
        imageData: null,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      allNotes.unshift(note);
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      return note;
    }

    async function updateNote(id, title, content, color) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      note.title = (title || '').trim();
      note.content = (content || '').trim();
      note.color = color;
      note.updatedAt = Date.now();
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
    }

    async function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      allNotes = allNotes.filter(n => n.id !== id);
      await saveNotesToStorage(currentUser.id, allNotes);
      renderAll();
      showToast('Deleted', 'trash');
      if (editingNoteId === id) closeEditor();
    }

    // ================================================================
    //  EDITOR
    // ================================================================
    function openEditor(noteId) {
      const note = noteId ? allNotes.find(n => n.id === noteId) : null;
      editingNoteId = note ? note.id : null;

      if (note) {
        editorModalTitle.textContent = 'Edit Note';
        noteTitleInput.value = note.title || '';
        noteContentInput.value = note.content || '';
        selectedColor = note.color !== undefined ? note.color : DEFAULT_COLOR;
        editorDeleteBtn.style.display = 'inline-flex';
      } else {
        editorModalTitle.textContent = 'New Note';
        noteTitleInput.value = '';
        noteContentInput.value = '';
        selectedColor = DEFAULT_COLOR;
        editorDeleteBtn.style.display = 'none';
      }
      renderEditorColorPicker(selectedColor);
      editorModal.classList.add('active');
      setTimeout(() => noteTitleInput.focus(), 100);
    }

    function closeEditor() {
      editorModal.classList.remove('active');
      editingNoteId = null;
    }

    function renderEditorColorPicker(selected) {
      editorColorPicker.innerHTML = '';
      const defaultOpt = document.createElement('div');
      defaultOpt.className = 'color-opt default-opt' + (selected === null || selected === '#ffffff' ? ' active' : '');
      defaultOpt.title = 'Default (theme)';
      defaultOpt.dataset.color = 'null';
      defaultOpt.addEventListener('click', () => {
        editorColorPicker.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
        defaultOpt.classList.add('active');
        selectedColor = null;
      });
      editorColorPicker.appendChild(defaultOpt);

      COLORS.filter(c => c.value !== null).forEach(c => {
        const el = document.createElement('div');
        el.className = 'color-opt' + (c.value === selected ? ' active' : '');
        el.style.background = c.value;
        if (c.value === '#ffffff') el.style.border = '2px solid #dadce0';
        el.dataset.color = c.value;
        el.title = c.name;
        el.addEventListener('click', () => {
          editorColorPicker.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
          el.classList.add('active');
          selectedColor = c.value;
        });
        editorColorPicker.appendChild(el);
      });
    }

    async function saveEditor() {
      const title = noteTitleInput.value;
      const content = noteContentInput.value;
      if (!title.trim() && !content.trim()) {
        showToast('Enter a title or content', 'exclamation-circle');
        return;
      }
      setLoading(true);
      try {
        if (editingNoteId) {
          await updateNote(editingNoteId, title, content, selectedColor);
          showToast('Updated', 'check-circle');
        } else {
          await createNote(title, content, selectedColor);
          showToast('Created', 'check-circle');
        }
        closeEditor();
      } catch (err) {
        console.error('Save error:', err);
        showToast('Error saving', 'exclamation-circle');
      } finally {
        setLoading(false);
      }
    }

    // ================================================================
    //  ACCOUNT DROPDOWN
    // ================================================================
    function renderAccountDropdown() {
      if (!currentUser) {
        accountDropdown.innerHTML = `
          <button class="drop-item" id="dropSignIn"><span class="icon"><i class="fas fa-sign-in-alt"></i></span><span class="label">Sign in</span></button>
        `;
        const btn = accountDropdown.querySelector('#dropSignIn');
        if (btn) btn.addEventListener('click', () => {
          accountDropdown.classList.remove('open');
          signinOverlay.classList.add('active');
          try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        });
        return;
      }

      const initial = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U';
      const avatarHtml = currentUser.picture ? `<img src="${currentUser.picture}" alt="" />` : initial;

      accountDropdown.innerHTML = `
        <div class="drop-item" style="cursor:default;background:transparent;">
          <div class="item-avatar">${avatarHtml}</div>
          <div class="item-info"><div class="name">${escHtml(currentUser.name)}</div><div class="email">${escHtml(currentUser.email)}</div></div>
          <span class="item-check"><i class="fas fa-check-circle"></i></span>
        </div>
        <div class="divider"></div>
        <button class="drop-item" id="dropSwitchAccount"><span class="icon"><i class="fas fa-exchange-alt"></i></span><span class="label">Switch account</span></button>
        <div class="divider"></div>
        <button class="drop-item danger" id="dropSignOut"><span class="icon"><i class="fas fa-sign-out-alt"></i></span><span class="label">Sign out</span></button>
      `;

      accountDropdown.querySelector('#dropSwitchAccount')?.addEventListener('click', () => {
        accountDropdown.classList.remove('open');
        triggerAccountSwitch();
      });

      accountDropdown.querySelector('#dropSignOut')?.addEventListener('click', () => {
        accountDropdown.classList.remove('open');
        signOut();
      });
      accountBadge.textContent = '1';
    }

    // ================================================================
    //  LEFT DROPDOWN EVENTS
    // ================================================================
    leftMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      leftDropdown.classList.toggle('open');
      accountDropdown.classList.remove('open');
    });

    leftAppearance.addEventListener('click', (e) => {
      e.stopPropagation();
      const sub = appearanceSub;
      if (sub.style.display === 'block') {
        sub.style.display = 'none';
      } else {
        sub.style.display = 'block';
      }
    });

    themeToggleTrack.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleTheme();
    });

    leftArchive.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showArchived = !showArchived;
      if (showDashboard) {
        showDashboard = false;
      }
      renderAll();
      leftArchive.querySelector('.label').textContent = showArchived ? '📦 Archived (hide)' : 'Archived';
    });

    leftDashboard.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showDashboard = !showDashboard;
      if (showDashboard) {
        if (showArchived) {
          showArchived = false;
          leftArchive.querySelector('.label').textContent = 'Archived';
        }
        renderDashboard();
        searchInput.style.display = 'none';
        notesGrid.style.display = 'none';
        dashboardView.classList.add('active');
      } else {
        dashboardView.classList.remove('active');
        searchInput.style.display = 'block';
        notesGrid.style.display = 'grid';
        renderNotes();
      }
    });

    leftExport.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      if (!currentUser) { showToast('Sign in first', 'exclamation-circle'); return; }
      exportNotes();
    });

    leftImport.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      if (!currentUser) { showToast('Sign in first', 'exclamation-circle'); return; }
      importNotes();
    });

    leftAbout.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
      showToast('📝 Notes App — Built with ❤️, copyright free, version 2.0', 'info-circle', 4000);
    });

    document.addEventListener('click', () => {
      leftDropdown.classList.remove('open');
    });
    leftDropdown.addEventListener('click', (e) => e.stopPropagation());

    // ================================================================
    //  EXPORT / IMPORT
    // ================================================================
    function exportNotes() {
      if (!allNotes.length) { showToast('No notes to export', 'exclamation-circle'); return; }
      const data = JSON.stringify(allNotes, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'notes_backup_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported', 'file-export');
    }

    function importNotes() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data) && data.length) {
              const existingIds = new Set(allNotes.map(n => n.id));
              const newNotes = data.filter(n => !existingIds.has(n.id));
              if (newNotes.length) {
                allNotes = [...allNotes, ...newNotes];
                await saveNotesToStorage(currentUser.id, allNotes);
                renderAll();
                showToast(`Imported ${newNotes.length} notes`, 'file-import');
              } else {
                showToast('No new notes to import', 'info-circle');
              }
            } else {
              showToast('Invalid file', 'exclamation-circle');
            }
          } catch (err) {
            console.error('Import error:', err);
            showToast('Error importing', 'exclamation-circle');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ================================================================
    //  RENDER APP
    // ================================================================
    function renderApp() {
      if (!currentUser) {
        signinOverlay.classList.add('active');
        notesGrid.className = 'notes-grid empty';
        notesGrid.innerHTML = `
          <div class="empty-icon"><i class="fas fa-pen-fancy"></i></div>
          <div class="empty-text">Sign in to see your notes</div>
          <div class="empty-sub">Your notes are securely stored</div>
        `;
        avatarLetter.textContent = 'G';
        accountBadge.textContent = '0';
        accountDropdown.innerHTML = '';
        dashboardView.classList.remove('active');
        searchInput.style.display = 'block';
        notesGrid.style.display = 'grid';
        setTimeout(() => {
          if (gsiBtn.children.length === 0) fallbackBtn.classList.add('visible');
        }, 1000);
        return;
      }
      signinOverlay.classList.remove('active');
      const initial = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U';
      if (currentUser.picture) {
        avatarLetter.innerHTML = `<img src="${currentUser.picture}" alt="" />`;
      } else {
        avatarLetter.textContent = initial;
      }
      showArchived = false;
      showDashboard = false;
      leftArchive.querySelector('.label').textContent = 'Archived';
      renderAll();
      renderAccountDropdown();
      accountBadge.textContent = '1';
    }

    // ================================================================
    //  SEARCH
    // ================================================================
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      if (!showDashboard) {
        renderNotes();
      }
    });

    // ================================================================
    //  FAB
    // ================================================================
    fabBtn.addEventListener('click', () => {
      if (!currentUser) {
        showToast('Please sign in first', 'exclamation-circle');
        signinOverlay.classList.add('active');
        try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        return;
      }
      openEditor(null);
    });

    // ================================================================
    //  EDITOR EVENTS
    // ================================================================
    editorSaveBtn.addEventListener('click', saveEditor);
    editorCancelBtn.addEventListener('click', closeEditor);
    editorCloseBtn.addEventListener('click', closeEditor);
    editorDeleteBtn.addEventListener('click', () => {
      if (editingNoteId) { deleteNote(editingNoteId);
        closeEditor(); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (editorModal.classList.contains('active')) closeEditor();
        if (accountDropdown.classList.contains('open')) accountDropdown.classList.remove('open');
        if (leftDropdown.classList.contains('open')) leftDropdown.classList.remove('open');
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        if (editorModal.classList.contains('active')) { e.preventDefault();
          saveEditor(); }
      }
    });

    // ================================================================
    //  AVATAR DROPDOWN
    // ================================================================
    avatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentUser) {
        signinOverlay.classList.add('active');
        try { google.accounts.id.prompt(); } catch (_) { fallbackBtn.classList.add('visible'); }
        return;
      }
      accountDropdown.classList.toggle('open');
      if (accountDropdown.classList.contains('open')) renderAccountDropdown();
      leftDropdown.classList.remove('open');
    });
    document.addEventListener('click', () => {
      accountDropdown.classList.remove('open');
    });
    accountDropdown.addEventListener('click', (e) => e.stopPropagation());

    // ================================================================
    //  REFRESH — single toast only
    // ================================================================
    refreshBtn.addEventListener('click', async () => {
      if (!currentUser) { showToast('Sign in first', 'exclamation-circle'); return; }
      setLoading(true);
      try {
        allNotes = await loadNotesFromStorage(currentUser.id);
        renderAll();
        showToast('Refreshed', 'sync-alt');
      } catch (err) {
        console.error('Refresh error:', err);
        showToast('Error refreshing', 'exclamation-circle');
      } finally {
        setLoading(false);
      }
    });

    // ================================================================
    //  FALLBACK BUTTON
    // ================================================================
    fallbackBtn.addEventListener('click', () => {
      try {
        if (typeof google !== 'undefined' && google.accounts) {
          google.accounts.id.prompt();
          return;
        }
      } catch (_) {}
      const redirectUri = window.location.origin + window.location.pathname;
      const finalRedirect = (window.location.hostname === 'notes.flatfusion.fun') ?
        'https://notes.flatfusion.fun/callback' :
        window.location.origin + window.location.pathname;
      const authUrl =
        `https://accounts.google.com/o/oauth2/v2/auth` +
        `?client_id=${CLIENT_ID}` +
        `&redirect_uri=${encodeURIComponent(finalRedirect)}` +
        `&response_type=token` +
        `&scope=openid%20profile%20email` +
        `&prompt=select_account`;
      const popup = window.open(authUrl, 'google_signin', 'width=500,height=600,resizable=yes,scrollbars=yes');
      if (!popup) { showToast('Popup blocked', 'exclamation-circle'); return; }
      const timer = setInterval(() => {
        try {
          const url = popup.location.href;
          if (url.includes('id_token=') || url.includes('access_token=')) {
            clearInterval(timer);
            const hash = popup.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token') || params.get('access_token');
            if (idToken) {
              const payload = JSON.parse(atob(idToken.split('.')[1]));
              handleUserSignIn({
                id: payload.sub,
                name: payload.name || 'User',
                email: payload.email || '',
                picture: payload.picture || '',
              });
            }
            popup.close();
          }
        } catch (_) {}
      }, 300);
      const checkClosed = setInterval(() => {
        if (popup.closed) { clearInterval(checkClosed);
          clearInterval(timer); }
      }, 500);
    });

    // ================================================================
    //  INIT
    // ================================================================
    async function init() {
      setLoading(true);
      try {
        loadTheme();
        const storedUser = loadUserFromStorage();
        if (storedUser) {
          currentUser = storedUser;
          allNotes = await loadNotesFromStorage(storedUser.id);
          initGoogleSignIn();
          renderApp();
          setTimeout(() => {
            try { google.accounts.id.prompt(); } catch (_) {}
          }, 1000);
        } else {
          signinOverlay.classList.add('active');
          initGoogleSignIn();
          renderApp();
        }
      } catch (err) {
        console.error('Init error:', err);
        showToast('Error loading app', 'exclamation-circle');
      } finally {
        setTimeout(() => setLoading(false), 2000);
        setLoading(false);
      }
    }

    function handleUrlNote() {
      const params = new URLSearchParams(window.location.search);
      const noteId = params.get('note');
      if (noteId && currentUser) {
        const note = allNotes.find(n => n.id === noteId);
        if (note) {
          setTimeout(() => {
            openEditor(noteId);
            showToast('Opening shared note...', 'link');
          }, 500);
        }
      }
    }

    window.addEventListener('popstate', handleUrlNote);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        init();
        setTimeout(handleUrlNote, 800);
      });
    } else {
      init();
      setTimeout(handleUrlNote, 800);
    }

    setTimeout(() => {
      if (gsiBtn.children.length === 0) fallbackBtn.classList.add('visible');
      if (typeof google === 'undefined' || !google.accounts) fallbackBtn.classList.add('visible');
    }, 4000);

    console.log('📝 Keep Notes — Fully loaded with all features');
    console.log('✅ Three-dot menu shows all options');
    console.log('✅ Switch Account works with robust fallback');
    console.log('✅ Links clickable, image upload works');
  </script>
</body>
</html>
