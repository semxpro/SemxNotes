<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keep – Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ===== ROOT ===== */
    :root {
      --bg-app: #f5f7fa;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --bg-input: #f1f3f4;
      --bg-hover: #f1f3f4;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-muted: #9aa0a6;
      --border-color: #e0e0e0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --accent-bg: #e8f0fe;
      --danger: #d93025;
      --danger-bg: #fce8e6;
      --warning: #fbbc04;
      --success: #34a853;
      --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --font: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --max-width: 1320px;
    }
    [data-theme="dark"] {
      --bg-app: #1e1e1e;
      --bg-card: #2d2d2d;
      --bg-header: #252525;
      --bg-input: #3d3d3d;
      --bg-hover: #3d3d3d;
      --text-primary: #e8eaed;
      --text-secondary: #b0b3b8;
      --text-muted: #7a7f85;
      --border-color: #3d3d3d;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
      --accent: #8ab4f8;
      --accent-hover: #6a9fdf;
      --accent-bg: #1e2a3a;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: var(--font);
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 999px;
    }

    /* ===== LOADING ===== */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-app);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }
    #loadingOverlay.active {
      display: flex;
    }
    #loadingOverlay .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #loadingOverlay .load-text {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.2px;
      animation: pulse-text 1.4s ease-in-out infinite;
    }
    @keyframes pulse-text {
      0%,
      100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    /* ===== TOAST ===== */
    #toastContainer {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 100%;
      max-width: 400px;
    }
    .toast-item {
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      border: 1px solid var(--border-color);
      text-align: center;
      max-width: 90vw;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast-item.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ===== SIGN-IN ===== */
    #signinOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg-app);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #signinOverlay.active {
      display: flex;
    }
    .signin-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      animation: popIn 0.35s ease;
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .signin-card .logo-icon {
      font-size: 52px;
      color: var(--warning);
      margin-bottom: 8px;
    }
    .signin-card h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .signin-card p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .signin-card .gsi-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 56px;
    }
    .signin-card .gsi-container #gsiBtn {
      min-height: 44px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .signin-card .gsi-container .fallback-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
      width: 100%;
      max-width: 280px;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .signin-card .gsi-container .fallback-btn:hover {
      background: var(--bg-input);
    }
    .signin-card .gsi-container .fallback-btn.visible {
      display: flex;
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--bg-header);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 64px;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .header-left .menu-icon {
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: var(--transition);
    }
    .header-left .menu-icon:hover {
      background: var(--bg-hover);
    }
    .header-left .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .header-left .brand i {
      font-size: 26px;
      color: var(--warning);
    }

    /* Left dropdown */
    .left-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 6px 0;
      min-width: 220px;
      display: none;
      z-index: 150;
      border: 1px solid var(--border-color);
      animation: slideDown 0.2s ease;
    }
    .left-dropdown.open {
      display: block;
    }
    .left-dropdown .drop-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 18px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-size: 14px;
      font-family: var(--font);
    }
    .left-dropdown .drop-item:hover {
      background: var(--bg-hover);
    }
    .left-dropdown .drop-item i {
      width: 20px;
      color: var(--text-secondary);
      font-size: 16px;
    }
    .left-dropdown .drop-item .label {
      flex: 1;
    }
    .left-dropdown .drop-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 16px;
    }
    .left-dropdown .appearance-wrap {
      padding: 0 18px 8px 18px;
    }
    .left-dropdown .appearance-wrap .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .left-dropdown .appearance-wrap .theme-row .theme-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-primary);
    }
    .left-dropdown .appearance-wrap .theme-row .theme-label i {
      width: 18px;
      color: var(--text-secondary);
    }
    .left-dropdown .toggle-track {
      width: 40px;
      height: 22px;
      background: var(--border-color);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .left-dropdown .toggle-track .toggle-thumb {
      width: 18px;
      height: 18px;
      background: var(--bg-card);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .left-dropdown .toggle-track.active {
      background: var(--accent);
    }
    .left-dropdown .toggle-track.active .toggle-thumb {
      left: 20px;
    }

    /* ===== HEADER CENTER ===== */
    .header-center {
      flex: 1;
      max-width: 680px;
      margin: 0 16px;
      position: relative;
    }
    .header-center .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }
    .header-center #searchInput {
      width: 100%;
      padding: 10px 16px 10px 44px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--bg-input);
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
      font-family: var(--font);
    }
    .header-center #searchInput:focus {
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
    }
    .header-center #searchInput::placeholder {
      color: var(--text-muted);
    }

    /* ===== HEADER RIGHT ===== */
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .header-right .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .header-right .icon-btn:hover {
      background: var(--bg-hover);
    }
    .avatar-wrap {
      position: relative;
      cursor: pointer;
    }
    .avatar-wrap .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      overflow: hidden;
      transition: var(--transition);
      border: 2px solid transparent;
      position: relative;
    }
    .avatar-wrap .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-wrap .avatar:hover {
      filter: brightness(0.95);
    }
    .avatar-wrap .avatar .badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-header);
    }

    /* Account Dropdown */
    .account-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 320px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 10px 0;
      display: none;
      z-index: 200;
      border: 1px solid var(--border-color);
      animation: slideDown 0.2s ease;
    }
    .account-dropdown.open {
      display: block;
    }
    .account-dropdown .drop-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      color: var(--text-primary);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-size: 14px;
      font-family: var(--font);
    }
    .account-dropdown .drop-item:hover {
      background: var(--bg-hover);
    }
    .account-dropdown .drop-item .item-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account-dropdown .drop-item .item-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .account-dropdown .drop-item .item-info {
      flex: 1;
      min-width: 0;
    }
    .account-dropdown .drop-item .item-info .name {
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-dropdown .drop-item .item-info .email {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-dropdown .drop-item .item-check {
      color: var(--accent);
      font-size: 16px;
    }
    .account-dropdown .divider {
      height: 1px;
      background: var(--border-color);
      margin: 6px 16px;
    }
    .account-dropdown .drop-item .icon {
      width: 24px;
      color: var(--text-secondary);
      font-size: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .account-dropdown .drop-item .label {
      flex: 1;
    }
    .account-dropdown .drop-item.danger .label {
      color: var(--danger);
    }
    .account-dropdown .drop-item.danger:hover {
      background: var(--danger-bg);
    }

    /* ===== MAIN ===== */
    .main-content {
      flex: 1;
      padding: 24px 32px 90px;
      max-width: var(--max-width);
      margin: 0 auto;
      width: 100%;
      transition: padding 0.3s ease;
    }

    /* ===== DASHBOARD ===== */
    .dashboard-view {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .dashboard-view.active {
      display: block;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .dashboard-view .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .dashboard-view .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .dashboard-view .stat-card:hover {
      box-shadow: var(--shadow-md);
    }
    .dashboard-view .stat-card .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .dashboard-view .stat-card .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .dashboard-view .stat-card .stat-icon {
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .dashboard-view .recent-notes {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .dashboard-view .recent-notes h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dashboard-view .recent-notes .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dashboard-view .recent-notes .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }
    .dashboard-view .recent-notes .recent-item:last-child {
      border-bottom: none;
    }
    .dashboard-view .recent-notes .recent-item .recent-title {
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .dashboard-view .recent-notes .recent-item .recent-date {
      color: var(--text-muted);
      font-size: 12px;
    }
    .dashboard-view .color-distribution {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .dashboard-view .color-distribution .color-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 6px;
      border-radius: 999px;
      background: var(--bg-input);
      font-size: 13px;
    }
    .dashboard-view .color-distribution .color-chip .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
    }

    /* ===== TRASH ===== */
    .trash-view {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .trash-view.active {
      display: block;
    }
    .trash-view .trash-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .trash-view .trash-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .trash-view .trash-header .trash-count {
      background: var(--bg-input);
      padding: 2px 12px;
      border-radius: 999px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .trash-view .trash-note {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }
    .trash-view .trash-note:hover {
      box-shadow: var(--shadow-sm);
    }
    .trash-view .trash-note .trash-info {
      flex: 1;
      min-width: 0;
    }
    .trash-view .trash-note .trash-info .trash-title {
      font-weight: 500;
      color: var(--text-primary);
    }
    .trash-view .trash-note .trash-info .trash-excerpt {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trash-view .trash-note .trash-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .trash-view .trash-note .trash-actions .trash-btn {
      background: none;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .trash-view .trash-note .trash-actions .trash-btn:hover {
      background: var(--bg-hover);
    }
    .trash-view .trash-note .trash-actions .trash-btn.restore-btn {
      color: var(--accent);
    }
    .trash-view .trash-note .trash-actions .trash-btn.restore-btn:hover {
      background: var(--accent-bg);
    }
    .trash-view .trash-note .trash-actions .trash-btn.delete-forever-btn {
      color: var(--danger);
    }
    .trash-view .trash-note .trash-actions .trash-btn.delete-forever-btn:hover {
      background: var(--danger-bg);
    }
    .trash-view .trash-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .trash-view .trash-empty i {
      font-size: 48px;
      opacity: 0.3;
      margin-bottom: 16px;
    }
    .trash-view .trash-empty .empty-text {
      font-size: 16px;
      font-weight: 500;
    }
    .trash-view .trash-empty .empty-sub {
      font-size: 14px;
      margin-top: 4px;
    }

    /* ===== NOTES GRID ===== */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .notes-grid.empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--text-secondary);
      text-align: center;
    }
    .notes-grid.empty .empty-icon {
      font-size: 64px;
      color: var(--text-muted);
      opacity: 0.3;
      margin-bottom: 16px;
    }
    .notes-grid.empty .empty-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .notes-grid.empty .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ===== NOTE CARD ===== */
    .note-card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 16px 18px 12px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      position: relative;
      word-wrap: break-word;
      overflow: visible;
      min-height: 100px;
      max-height: 600px;
      cursor: default;
    }
    .note-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .note-card .note-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
      word-break: break-word;
    }
    .note-card .note-content {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      max-height: 300px;
    }
    .note-card .note-content a {
      color: var(--accent);
      text-decoration: underline;
      word-break: break-all;
    }
    .note-card .note-content a:hover {
      text-decoration: none;
    }
    .note-card .note-content:empty {
      display: none;
    }
    .note-card .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .note-card .note-meta .note-date {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .note-card .pin-badge {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 14px;
      color: var(--accent);
      opacity: 0.6;
    }
    .note-card .note-image {
      margin: 6px 0 8px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      max-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      flex-shrink: 0;
    }
    .note-card .note-image img {
      width: 100%;
      height: auto;
      max-height: 160px;
      object-fit: cover;
    }
    .note-card .note-type-badge {
      position: absolute;
      bottom: 32px;
      right: 8px;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
      background: var(--bg-input);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* ===== LINK EMBED ===== */
    .link-embed {
      margin: 8px 0 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      overflow: hidden;
      background: var(--bg-card);
      transition: var(--transition);
      display: flex;
      align-items: stretch;
      max-height: 140px;
    }
    .link-embed:hover {
      box-shadow: var(--shadow-sm);
    }
    .link-embed .link-image {
      width: 120px;
      min-height: 80px;
      flex-shrink: 0;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .link-embed .link-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .link-embed .link-image .no-img {
      font-size: 32px;
      color: var(--text-muted);
      opacity: 0.3;
    }
    .link-embed .link-info {
      padding: 10px 14px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .link-embed .link-info .link-title {
      font-weight: 500;
      font-size: 14px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-embed .link-info .link-desc {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .link-embed .link-info .link-domain {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .link-embed .link-info .link-domain img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
    .link-embed .link-info .link-domain a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .link-embed .link-info .link-domain a:hover {
      text-decoration: underline;
      color: var(--accent);
    }

    /* ===== THREE-DOT MENU — fixed position ===== */
    .note-card .card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      opacity: 0;
      transition: var(--transition);
      z-index: 10;
    }
    .note-card:hover .card-actions {
      opacity: 1;
    }
    .note-card .card-actions .more-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition);
    }
    .note-card .card-actions .more-btn:hover {
      background: var(--bg-hover);
    }

    /* Menu appears BELOW the card (fixed position) */
    .note-card .card-menu {
      position: fixed;
      top: auto;
      bottom: auto;
      left: auto;
      right: auto;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 6px 0;
      min-width: 210px;
      max-height: 380px;
      overflow-y: auto;
      display: none;
      z-index: 999;
      border: 1px solid var(--border-color);
    }
    .note-card .card-menu.open {
      display: block;
    }
    .note-card .card-menu .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-size: 13px;
      font-family: var(--font);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
    }
    .note-card .card-menu .menu-item:hover {
      background: var(--bg-hover);
    }
    .note-card .card-menu .menu-item i {
      width: 18px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .note-card .card-menu .menu-item.danger {
      color: var(--danger);
    }
    .note-card .card-menu .menu-item.danger i {
      color: var(--danger);
    }
    .note-card .card-menu .menu-item.danger:hover {
      background: var(--danger-bg);
    }
    .note-card .card-menu .menu-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 16px;
    }
    .note-card .card-menu .color-picker-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 16px 12px;
      border-top: 1px solid var(--border-color);
      margin-top: 4px;
    }
    .note-card .card-menu .color-picker-sub .color-opt {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .note-card .card-menu .color-picker-sub .color-opt:hover {
      transform: scale(1.12);
    }
    .note-card .card-menu .color-picker-sub .color-opt.active {
      border-color: var(--text-primary);
      box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--text-primary);
    }

    /* ===== FAB ===== */
    .fab-wrapper {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .fab {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--warning);
      color: #202124;
      border: none;
      font-size: 28px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fab:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(251, 188, 4, 0.4);
    }
    .fab:active {
      transform: scale(0.94);
    }

    .fab-menu {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      animation: slideUp 0.25s ease;
    }
    .fab-menu.open {
      display: flex;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .fab-menu .fab-option {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 18px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text-primary);
      min-width: 140px;
      justify-content: flex-start;
    }
    .fab-menu .fab-option:hover {
      background: var(--bg-hover);
      transform: scale(1.02);
    }
    .fab-menu .fab-option i {
      font-size: 18px;
      width: 24px;
      color: var(--text-secondary);
    }

    /* ===== EDITOR ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-editor {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 700px;
      box-shadow: var(--shadow-lg);
      animation: popIn 0.25s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 92vh;
      border: 1px solid var(--border-color);
    }
    .modal-editor .modal-header {
      padding: 16px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-editor .modal-header .modal-title {
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
    }
    .modal-editor .modal-header .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 50%;
      transition: var(--transition);
    }
    .modal-editor .modal-header .close-btn:hover {
      background: var(--bg-hover);
    }
    .modal-editor .modal-body {
      padding: 8px 20px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-editor .modal-body .editor-title {
      width: 100%;
      border: none;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 8px 0 4px;
      outline: none;
      font-family: var(--font);
      background: transparent;
    }
    .modal-editor .modal-body .editor-title::placeholder {
      color: var(--text-muted);
    }
    .modal-editor .modal-body .editor-content {
      width: 100%;
      border: none;
      font-size: 15px;
      color: var(--text-secondary);
      padding: 8px 0 12px;
      outline: none;
      resize: vertical;
      min-height: 120px;
      font-family: var(--font);
      line-height: 1.7;
      background: transparent;
      word-break: break-word;
    }
    .modal-editor .modal-body .editor-content::placeholder {
      color: var(--text-muted);
    }
    .modal-editor .modal-body .editor-image-preview {
      display: none;
      margin: 8px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      max-height: 200px;
      background: var(--bg-input);
    }
    .modal-editor .modal-body .editor-image-preview img {
      width: 100%;
      height: auto;
      max-height: 200px;
      object-fit: contain;
    }
    .modal-editor .modal-body .drawing-canvas-wrap {
      display: none;
      margin: 8px 0;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #fff;
      touch-action: none;
    }
    .modal-editor .modal-body .drawing-canvas-wrap canvas {
      width: 100%;
      height: auto;
      display: block;
      touch-action: none;
    }
    .modal-editor .modal-body .list-items-wrap {
      display: none;
      margin: 8px 0;
    }
    .modal-editor .modal-body .list-items-wrap textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-input);
      resize: vertical;
      outline: none;
    }
    .modal-editor .modal-body .list-items-wrap textarea:focus {
      border-color: var(--accent);
    }
    .modal-editor .modal-body .color-picker-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 0 4px;
      border-top: 1px solid var(--border-color);
      margin-top: 4px;
    }
    .modal-editor .modal-body .color-picker-row .color-opt {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .modal-editor .modal-body .color-picker-row .color-opt:hover {
      transform: scale(1.08);
    }
    .modal-editor .modal-body .color-picker-row .color-opt.active {
      border-color: var(--text-primary);
      box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--text-primary);
    }
    .modal-editor .modal-body .color-picker-row .color-opt.default-opt {
      background: conic-gradient(white 50%, #ccc 50%);
      border-color: var(--border-color);
    }
    .modal-editor .modal-footer {
      padding: 8px 20px 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border-color);
    }
    .modal-editor .modal-footer .btn {
      padding: 8px 22px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
    }
    .modal-editor .modal-footer .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .modal-editor .modal-footer .btn-primary:hover {
      background: var(--accent-hover);
    }
    .modal-editor .modal-footer .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
    }
    .modal-editor .modal-footer .btn-secondary:hover {
      background: var(--bg-hover);
    }
    .modal-editor .modal-footer .btn-danger {
      background: transparent;
      color: var(--danger);
    }
    .modal-editor .modal-footer .btn-danger:hover {
      background: var(--danger-bg);
    }

    /* ===== FOOTER ===== */
    .app-footer {
      text-align: center;
      padding: 12px 20px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      margin-top: auto;
      background: var(--bg-header);
      transition: var(--transition);
    }
    .app-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .app-footer a:hover {
      text-decoration: underline;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .app-header {
        padding: 6px 12px;
        min-height: 56px;
      }
      .header-left .brand {
        font-size: 17px;
      }
      .header-left .brand i {
        font-size: 22px;
      }
      .header-center {
        margin: 0 8px;
      }
      .header-center #searchInput {
        padding: 8px 12px 8px 36px;
        font-size: 14px;
      }
      .header-center .search-icon {
        left: 10px;
        font-size: 14px;
      }
      .header-right .icon-btn {
        width: 34px;
        height: 34px;
        font-size: 16px;
      }
      .avatar-wrap .avatar {
        width: 32px;
        height: 32px;
        font-size: 13px;
      }
      .main-content {
        padding: 16px 12px 80px;
      }
      .notes-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
      }
      .account-dropdown {
        width: 280px;
        right: -8px;
      }
      .modal-editor {
        max-width: 100%;
        margin: 8px;
        border-radius: var(--radius-sm);
      }
      .signin-card {
        padding: 32px 20px 28px;
      }
      .fab-wrapper {
        bottom: 18px;
        right: 18px;
      }
      .fab {
        width: 50px;
        height: 50px;
        font-size: 24px;
      }
      .note-card .card-actions {
        opacity: 1;
      }
      .left-dropdown {
        left: -10px;
      }
      .dashboard-view .stats-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
      .link-embed {
        flex-direction: column;
        max-height: none;
      }
      .link-embed .link-image {
        width: 100%;
        height: 100px;
      }
    }
    @media (max-width: 480px) {
      .notes-grid {
        grid-template-columns: 1fr;
      }
      .header-center #searchInput {
        font-size: 13px;
      }
      .account-dropdown {
        width: 260px;
        right: -4px;
      }
      .header-left .brand span {
        display: none;
      }
      .dashboard-view .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .fab-menu .fab-option {
        min-width: 120px;
        padding: 8px 14px;
        font-size: 13px;
      }
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ===== LOADING ===== -->
  <div id="loadingOverlay" class="active">
    <div class="spinner"></div>
    <div class="load-text">Loading your notes...</div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toastContainer"></div>

  <!-- ===== SIGN-IN ===== -->
  <div id="signinOverlay">
    <div class="signin-card">
      <div class="logo-icon"><i class="fas fa-pen-fancy"></i></div>
      <h1>Notes</h1>
      <p>Sign in with your Google account to save and sync your notes securely.</p>
      <div class="gsi-container">
        <div id="gsiBtn"></div>
        <button id="fallbackBtn" class="fallback-btn">
          <i class="fab fa-google"></i> Sign in with Google
        </button>
      </div>
    </div>
  </div>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-left">
      <span class="menu-icon" id="leftMenuBtn"><i class="fas fa-bars"></i></span>
      <div class="brand"><i class="fas fa-pen-fancy"></i><span>Notes</span></div>
      <div class="left-dropdown" id="leftDropdown" role="menu">
        <div class="drop-item" id="leftDashboard"><i class="fas fa-chart-pie"></i><span class="label">Dashboard</span></div>
        <div class="drop-divider"></div>
        <div class="drop-item" id="leftAppearance"><i class="fas fa-palette"></i><span class="label">Appearance</span><i class="fas fa-chevron-right" style="margin-left:auto;font-size:12px;"></i></div>
        <div class="appearance-wrap" id="appearanceSub" style="display:none;">
          <div class="theme-row"><span class="theme-label"><i class="fas fa-moon"></i> Theme</span><div class="toggle-track" id="themeToggleTrack"><div class="toggle-thumb"></div></div></div>
        </div>
        <div class="drop-divider"></div>
        <div class="drop-item" id="leftArchive"><i class="fas fa-archive"></i><span class="label">Archived</span><span id="archiveCount" style="background:var(--accent);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;margin-left:auto;">0</span></div>
        <div class="drop-item" id="leftTrash"><i class="fas fa-trash"></i><span class="label">Trash</span><span id="trashCount" style="background:var(--danger);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;margin-left:auto;">0</span></div>
        <div class="drop-divider"></div>
        <div class="drop-item" id="leftExport"><i class="fas fa-file-export"></i><span class="label">Export notes</span></div>
        <div class="drop-item" id="leftImport"><i class="fas fa-file-import"></i><span class="label">Import notes</span></div>
        <div class="drop-divider"></div>
        <div class="drop-item" id="leftAbout"><i class="fas fa-info-circle"></i><span class="label">About</span></div>
      </div>
    </div>
    <div class="header-center">
      <span class="search-icon"><i class="fas fa-search"></i></span>
      <input type="text" id="searchInput" placeholder="Search notes..." />
    </div>

      <button class="icon-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>

    // ================================================================

    let toastTimer = null;

    function showToast(msg, icon = 'info-circle', duration = 2800) {
      if (toastEl) {
        toastEl.classList.remove('show');
        setTimeout(() => { if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
          toastEl = null; }, 100);
        clearTimeout(toastTimer);
      }
      toastEl = document.createElement('div');
      toastEl.className = 'toast-item';
      toastEl.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
      toastContainer.appendChild(toastEl);
      requestAnimationFrame(() => toastEl.classList.add('show'));
      toastTimer = setTimeout(() => {
        if (toastEl) {
          toastEl.classList.remove('show');
          setTimeout(() => { if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
            toastEl = null; }, 400);
        }
      }, duration);
    }

      } catch (_) { currentTheme = 'light'; }
      applyTheme();
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', currentTheme);
      const isDark = currentTheme === 'dark';

      try { localStorage.setItem(THEME_KEY, currentTheme); } catch (_) {}
      renderAll();
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';

    // ================================================================

    function getStorageKey(userId) { return STORAGE_KEY_PREFIX + userId; }

    async function loadNotesFromStorage(userId) {
      try { const raw = localStorage.getItem(getStorageKey(userId)); return raw ? JSON.parse(raw) : []; } catch (_) { return []; }
    }

    async function saveNotesToStorage(userId, notes) {
      try { localStorage.setItem(getStorageKey(userId), JSON.stringify(notes)); } catch (_) {}
    }

    function saveUserToStorage(user) { try { localStorage.setItem(USER_KEY, JSON.stringify(user)); } catch (_) {} }

    function loadUserFromStorage() {
      try { const raw = localStorage.getItem(USER_KEY); return raw ? JSON.parse(raw) : null; } catch (_) { return null; }
    }

    function clearUserStorage() { try { localStorage.removeItem(USER_KEY); } catch (_) {} }

    // ================================================================

    function initGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts) { setTimeout(initGoogleSignIn, 300); return; }
      if (gsiInited) return;
      gsiInited = true;
      try {
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse,
          prompt: 'select_account',

          context: 'signin',

        google.accounts.id.renderButton(gsiBtn, {

          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: 280,
        });
        setTimeout(() => { if (gsiBtn.children.length === 0) fallbackBtn.classList.add('visible'); }, 2000);
        setTimeout(() => { try { google.accounts.id.prompt(); } catch (_) {} }, 600);
      } catch (err) { console.error('GIS init error:', err);
        fallbackBtn.classList.add('visible'); }
    }

    function handleCredentialResponse(response) {
      if (!response.credential) return;
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        handleUserSignIn({
          id: payload.sub,
          name: payload.name || 'User',
          email: payload.email || '',
          picture: payload.picture || '',
        });
      } catch (err) { console.error('Credential parse error:', err);
        showToast('Sign-in failed', 'exclamation-circle'); }
    }

    async function handleUserSignIn(user) {
      setLoading(true);
      try {
        currentUser = user;
        saveUserToStorage(user);

        signinOverlay.classList.remove('active');
        showDashboard = false;
        showTrash = false;
        renderApp();
        showToast(`Welcome, ${user.name}!`, 'check-circle');
        setTimeout(() => { try { google.accounts.id.prompt(); } catch (_) {} }, 500);

        showToast('Error signing in', 'exclamation-circle'); } finally { setLoading(false); }
    }

    // ================================================================
    //  TRASH — Auto-delete after 7 days
    // ================================================================
    function cleanTrash() {
      const now = Date.now();
      const threshold = TRASH_DAYS * 24 * 60 * 60 * 1000;
      let changed = false;
      allNotes = allNotes.filter(n => {
        if (n.deletedAt && (now - n.deletedAt > threshold)) { changed = true; return false; }
        return true;
      });
      if (changed) saveNotesToStorage(currentUser.id, allNotes);
    }

    // ================================================================
    //  LINK EMBED — fetch OG data via CORS proxy
    // ================================================================
    async function fetchLinkPreview(url) {
      if (linkEmbedCache[url]) return linkEmbedCache[url];

      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Fetch failed');
        const html = await response.text();

        // Parse OG tags
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const head = doc.head;

        const getMeta = (prop) => {
          const el = head.querySelector(`meta[property="${prop}"]`) || head.querySelector(`meta[name="${prop}"]`);
          return el ? el.getAttribute('content') : null;
        };

        const title = getMeta('og:title') || head.querySelector('title')?.textContent || new URL(url).hostname;
        const description = getMeta('og:description') || getMeta('description') || '';
        const image = getMeta('og:image') || '';
        const siteName = getMeta('og:site_name') || new URL(url).hostname;
        const favicon = `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`;

        const result = { title, description, image, siteName, favicon, url };
        linkEmbedCache[url] = result;
        return result;
      } catch (err) {
        console.warn('Link preview fetch failed:', err);
        // Fallback: show domain with favicon
        const domain = new URL(url).hostname;
        const fallback = {
          title: domain,
          description: url,
          image: '',
          siteName: domain,
          favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=64`,
          url: url
        };
        linkEmbedCache[url] = fallback;
        return fallback;
      }
    }

    // ================================================================
    //  RENDER: DASHBOARD
    // ================================================================
    function renderDashboard() {
      if (!currentUser) return;
      const active = allNotes.filter(n => !n.deletedAt);
      const total = active.length,
        pinned = active.filter(n => n.pinned).length,
        archived = active.filter(n => n.archived).length,
        trash = allNotes.filter(n => n.deletedAt).length;
      const colors = {};
      active.forEach(n => { const c = n.color || 'default';
        colors[c] = (colors[c] || 0) + 1; });

      statsGrid.innerHTML = `
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-file-alt"></i></div><div class="stat-number">${total}</div><div class="stat-label">Total Notes</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-thumbtack"></i></div><div class="stat-number">${pinned}</div><div class="stat-label">Pinned</div></div>

        <div class="stat-card"><div class="stat-icon"><i class="fas fa-palette"></i></div><div class="stat-number">${colorEntries.length}</div><div class="stat-label">Colors Used</div></div>
      `;
      const recent = [...active].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 5);
      if (recent.length === 0) { recentList.innerHTML =
        `<div style="color:var(--text-muted);padding:8px 0;">No notes yet.</div>`; } else {
        let html = '';
        recent.forEach(n => { const title = n.title || 'Untitled';

            `<div class="recent-item"><span class="recent-title">${escHtml(title)}</span><span class="recent-date">${date}</span></div>`; });

      }
      if (colorEntries.length > 0) {
        let colorHtml = '<div class="color-distribution">';
